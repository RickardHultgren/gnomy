<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heraldic Role Emblem – AI Prompt Generator</title>
    <style>
        /* CSS remains unchanged as it was working well */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Garamond', 'Georgia', serif; line-height: 1.6; color: #d4c5b9; background: #1a1412; padding: 16px; padding-bottom: 80px; }
        .container { max-width: 800px; margin: 0 auto; background: linear-gradient(145deg, #2a1f1a 0%, #1f1511 100%); border-radius: 12px; padding: 24px; border: 1px solid #3d2817; }
        header { text-align: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px solid #4a3527; }
        h1 { font-size: 1.75rem; color: #e8d4b8; margin-bottom: 12px; }
        .subtitle { font-size: 0.95rem; color: #a89379; font-style: italic; }
        .section { margin-bottom: 32px; }
        .section-title { font-size: 1.25rem; color: #d4af77; margin-bottom: 16px; border-bottom: 1px solid #3d2817; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #c4a57b; font-size: 0.95rem; }
        input, textarea, select { width: 100%; padding: 14px; border: 2px solid #3d2817; border-radius: 6px; background: #1a1412; color: #d4c5b9; font-family: inherit; }
        textarea { min-height: 100px; }
        button { width: 100%; padding: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-generate { background: linear-gradient(145deg, #6d4c0f 0%, #4a3209 100%); color: #f4e4d0; border: 2px solid #8b6914; }
        .btn-copy { background: linear-gradient(145deg, #4a3527 0%, #2a1f1a 100%); color: #d4af77; border: 2px solid #3d2817; }
        .output-section { margin-top: 32px; padding-top: 32px; border-top: 2px solid #4a3527; }
        .output-area { width: 100%; min-height: 200px; padding: 16px; background: #0f0a08; color: #c4a57b; white-space: pre-wrap; font-family: 'Courier New', monospace; border: 2px solid #3d2817; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Heraldic Role Emblem Generator</h1>
            <p class="subtitle">Transform role descriptions into symbolic heraldic imagery.</p>
        </header>

        <form id="emblemForm">
            <div class="section">
                <h2 class="section-title">Role Identity</h2>
                <div class="field">
                    <label for="roleName">Role Name</label>
                    <input type="text" id="roleName" placeholder="e.g., Team Lead">
                </div>
                <div class="field">
                    <label for="context">Context / Domain</label>
                    <input type="text" id="context" placeholder="e.g., workplace">
                </div>
                <div class="field">
                    <label for="challenge">Challenge for You</label>
                    <input type="text" id="challenge" placeholder="What is your biggest challenge?">
                </div>
                <div class="field">
                    <label for="motto">Role Motto</label>
                    <input type="text" id="motto" placeholder="e.g., 'Protect and guide'">
                </div>
                <div class="field">
                    <label for="tone">Emotional Tone</label>
                    <select id="tone">
                        <option value="calm">Calm</option>
                        <option value="protective">Protective</option>
                        <option value="decisive">Decisive</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">Heraldic Symbolism</h2>
                <div class="field">
                    <label for="primaryCharge">Primary Charge (Central Symbol)</label>
                    <select id="primaryCharge">
                        <option value="lion">Lion – courage</option>
                        <option value="scales">Scales – balance</option>
                        <option value="key">Key – trust</option>
                    </select>
                </div>
                <div class="field">
                    <label for="crest">Crest (Above Shield)</label>
                    <select id="crest">
                        <option value="None">None</option>
                        <option value="crown">Crown</option>
                        <option value="helm">Helm</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn-generate" onclick="generatePrompt()">Generate Prompt</button>
        </form>

        <div id="outputSection" class="output-section hidden">
            <h2 class="section-title">Generated AI Image Prompt</h2>
            <div id="outputArea" class="output-area"></div>
            <button type="button" id="copyBtn" class="btn-copy" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function generatePrompt() {
            // Fetch values
            const roleName = document.getElementById('roleName').value || 'Undefined Role';
            const context = document.getElementById('context').value || 'unspecified context';
            const challenge = document.getElementById('challenge').value || '';
            const motto = document.getElementById('motto').value || '';
            const tone = document.getElementById('tone').selectedOptions[0].text;
            const primaryCharge = document.getElementById('primaryCharge').selectedOptions[0].text;
            const crest = document.getElementById('crest').value;

            let prompt = `A heraldic emblem representing the role of "${roleName}" within the context of ${context}.\n\n`;
            
            prompt += `ROLE DEFINITION:\n`;
            if (motto) prompt += `Motto: "${motto}"\n`;
            prompt += `Emotional tone: ${tone}\n\n`;

            prompt += `HERALDIC COMPOSITION:\n`;
            prompt += `Primary charge: ${primaryCharge}\n`;
            
            // Fixed logic for Crest and Challenge
            if (crest !== 'None') {
                prompt += `Crest above shield: ${crest}`;
                if (challenge) prompt += ` integrated with symbols of "${challenge}"`;
                prompt += `\n`;
            }

            prompt += `\nVISUAL STYLE:\n`;
            prompt += `Highly detailed, ornate border, dark atmospheric lighting, gothic aesthetic.\n`;
            prompt += `Centered composition, professional quality, high resolution.`;

            document.getElementById('outputArea').textContent = prompt;
            document.getElementById('outputSection').classList.remove('hidden');
            document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
        }

        async function copyToClipboard() {
            const text = document.getElementById('outputArea').textContent;
            const btn = document.getElementById('copyBtn');
            const originalText = btn.textContent;

            try {
                await navigator.clipboard.writeText(text);
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            } catch (err) {
                // Fallback for older browsers
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            }
        }
    </script>
</body>
</html>
