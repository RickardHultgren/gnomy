        <div id="squareRight">
            <!--div id="ToDo"></div-->
            <button id="addNodeButton">Add Node</button>
            <div id="hudRight">
                <div id="theTree">
    
                        <!--svg width="600" height="400"></svg-->

                        
                        <svg id="treeSvg" style="background-color:#0088ff; width:100%; height:100%;""></svg>

                        <script>
                          let treeData = {
                            name: "Root",
                            children: [
                              {
                                name: "Branch A",
                                children: [{ name: "Leaf A1" }, { name: "Leaf A2" }],
                              },
                              { name: "Branch B" },
                            ],
                          };
                      
                          const width = document.getElementById('theTree').offsetWidth;
                          const height = document.getElementById('theTree').offsetHeight;
                      
                          const svg = d3.select("#treeSvg");
                          const treeLayout = d3.tree().size([width, height - 100]);
                      
                          let markedNode = null;
                      
                          function updateTree() {
                            const root = d3.hierarchy(treeData);
                            treeLayout(root);
                      
                            // Update nodes
                            const nodes = svg.selectAll(".node").data(root.descendants(), (d) => d.data.name);
                      
                            const nodeEnter = nodes
                              .enter()
                              .append("g")
                              .attr("class", "node")
                              .attr("transform", (d) => `translate(${d.x},${height - d.y})`)
                              .on("click", (event, d) => {
                                markedNode = d;
                                markBranch(d);
                              });
                      
                            nodeEnter.append("circle").attr("r", 5);
                            nodeEnter.append("text").attr("dy", -8).text((d) => d.data.name);
                      
                            nodes
                              .merge(nodeEnter)
                              .transition()
                              .duration(500)
                              .attr("transform", (d) => `translate(${d.x},${height - d.y})`);
                      
                            nodes.exit().remove();
                      
                            // Update links
                            const links = svg.selectAll(".link").data(root.links(), (d) => `${d.source.data.name}-${d.target.data.name}`);
                      
                            links
                              .enter()
                              .insert("path", "g")
                              .attr("class", "link")
                              .merge(links)
                              .transition()
                              .duration(500)
                              .attr(
                                "d",
                                d3
                                  .linkVertical()
                                  .x((d) => d.x)
                                  .y((d) => height - d.y)
                              );
                      
                            links.exit().remove();
                          }
                      
                          function markBranch(d) {
                            // Clear all marks
                            svg.selectAll(".node circle").classed("marked", false).classed("child", false);
                            svg.selectAll(".node text").classed("marked", false).classed("child", false);
                            svg.selectAll(".link").classed("marked", false).classed("child", false);
                      
                            // Mark the selected branch
                            d3.select(d3.select(`.node circle:nth-of-type(${d.depth + 1})`).node())
                              .classed("marked", true);
                      
                            d3.selectAll(d.ancestors().reverse()).selectAll(".node").classed("marked", true);
                          }
                      
                          function addNode() {
                            if (markedNode) {
                              if (!markedNode.data.children) markedNode.data.children = [];
                              markedNode.data.children.push({ name: "new node" });
                              updateTree();
                            }
                          }
                      
                          document.getElementById("addNodeButton").addEventListener("click", addNode);
                      
                          updateTree();
                        </script>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    function updateMapWithNodes(selectedSituation) {
        // Clear previous visualization
        d3.select("#map").selectAll("*").remove();

        // Find all links where "from" matches the selected situation
        const links = Object.keys(situationLinks)
            .filter(key => situationLinks[key].from.includes(selectedSituation))
            .map(key => situationLinks[key]); 

        if (links.length === 0) {
            console.log("No links found for the selected situation.");
            return;
        }

        const fromText = links[0].from[0]; 
        const toTexts = [...new Set(links.flatMap(link => link.to))];

        // Create an SVG container
        //const width = 500;
        const width = document.getElementById('map').offsetWidth;
        //const height = 300;
        const height = document.getElementById('map').offsetHeight;
        const svg = d3.select("#map")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const centerX = width / 2;
        const centerY = height / 2;

        const nodes = [
            { id: "from", text: fromText, x: centerX, y: centerY }
        ];

        const radius = 100;
        const angleStep = (2 * Math.PI) / toTexts.length;

        toTexts.forEach((toText, index) => {
            const angle = index * angleStep;
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);
            nodes.push({ id: "to" + index, text: toText, x, y });
        });

        // Create tree-shaped nodes instead of simple circles
        nodes.forEach(d => {
            const crownTop = { x: d.x, y: d.y - 10, r: 10 };
            const crownBottom = { x: d.x, y: d.y + 5, r: 15 };
            const trunkBottomY = d.y + 35; // Bottom of the trunk

            // Append tree crowns (two circles)
            svg.append("circle")
                .attr("cx", crownTop.x)
                .attr("cy", crownTop.y)
                .attr("r", crownTop.r)
                .style("fill", "#2f9000");

            svg.append("circle")
                .attr("cx", crownBottom.x)
                .attr("cy", crownBottom.y)
                .attr("r", crownBottom.r)
                .style("fill", "#2f9000");

            // Append trunk (line)
            svg.append("line")
                .attr("x1", d.x)
                .attr("y1", d.y + 15)
                .attr("x2", d.x)
                .attr("y2", trunkBottomY)
                .attr("stroke", "#8B4513")
                .attr("stroke-width", 7);

            // Save the trunk bottom coordinate for link connections
            d.trunkBottomY = trunkBottomY;
        });

        // Draw connecting lines **from the bottom of the trunk**
        svg.selectAll("line.link")
            .data(nodes.slice(1)) // Exclude "from" node
            .enter()
            .append("line")
            .attr("class", "link")
            .attr("x1", centerX)
            .attr("y1", nodes[0].trunkBottomY)  // Start from the bottom of center tree's trunk
            .attr("x2", d => d.x)
            .attr("y2", d => d.trunkBottomY)  // Connect to the bottom of each "to" tree trunk
            .attr("stroke", "#443300")
            .attr("stroke-width", 4);

        // Add text labels
        svg.selectAll("text")
            .data(nodes)
            .enter()
            .append("text")
            .attr("x", d => d.x)
            .attr("y", d => d.trunkBottomY + 15)  // Position text below the trunk
            .attr("text-anchor", "middle")
            .style("fill", "black")
            .style("font-size", "12px")
            .style("font-family", "Arial")
            .text(d => d.text);
    }

    // Event listener for situationDropdown
    const situationDropdown = document.getElementById("situationDropdown");
    situationDropdown.addEventListener("change", (event) => {
        updateMapWithNodes(event.target.value);
    });
</script>

        return;

    for (const key in database) {

        }

    };
