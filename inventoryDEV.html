<body>
    <div id="contexts"></div>
    <div id="popupForm">
        <div id="popupContent">
            <h2>Enter Details</h2>
            <label for="gardenInput">Garden/Context:</label><br>
            <input type="text" id="gardenInput" placeholder="Enter Garden/Context"><br>
            <button onclick="submitPopup()">Submit</button>
        </div>
    </div>

    <div id="addItemPopup">
        <div id="addItemContent">
            <h2>Add New Item</h2>
            <label for="newItemInput">Item Name:</label><br>
            <input type="text" id="newItemInput" placeholder="Enter item name"><br>
            <button onclick="submitNewItem()">Add Item</button>
            <button onclick="closeAddItemPopup()">Cancel</button>
        </div>
    </div>
    <div id="editPopup">
        <div id="editPopupContent">
            <h2>Edit Item</h2>
            <label for="editItemInput">Item Name:</label><br>
            <input type="text" id="editItemInput" placeholder="Enter new name"><br>
            <button onclick="submitEdit()">Save</button>
            <button onclick="closeEditPopup()">Cancel</button>
        </div>
    </div>

    <div class="tableMain">
        <div class="tableBody">
            <div id="garden">Context/Garden</div>
            <button class="actionButton" onclick="document.getElementById('popupForm').style.display = 'flex';">Edit</button>
            <div id="current"></div>
            <div class="tab">
                <button class="tablinks" onclick="showCategory('Relatedness')"><span class="reality">Relatedness</span> <br><span class="tale">Flowers</span></button>
                <button class="tablinks" onclick="showCategory('Competence')"><span class="reality">Competence</span> <br><span class="tale">Fruits</span></button>
                <button class="tablinks" onclick="showCategory('Autonomy')"><span class="reality">Autonomy</span> <br><span class="tale">Spells</span></button>
            </div>
            <div id="inventoryContent" class="tableBody"></div>
        </div>
    </div>
    <div id="buttons">
        <button>History</button>
    </div>

    <script>
        const inventoryData = {
            "contexts": {
                "Home": {
                    "Relatedness": ["Rose", "Tulip", "Lily"],
                    "Competence": ["Apple", "Banana", "Cherry"],
                    "Autonomy": ["House Key", "Safe Key"]
                },
                "Work": {
                    "Relatedness": [],
                    "Competence": [],
                    "Autonomy": ["Car Key"]
                },
                "Hobby": {
                    "Relatedness": [],
                    "Competence": [],
                    "Autonomy": ["Football"]
                }
            }
        };
    
        let currentContext = null;
    
        function createDropdown() {
            const container = document.getElementById("contexts");
            const dropdown = document.createElement("select");
            dropdown.id = "contextDropdown";
    
            const defaultOption = document.createElement("option");
            defaultOption.textContent = "Select a context...";
            defaultOption.value = "";
            dropdown.appendChild(defaultOption);
    
            Object.keys(inventoryData.contexts).forEach((context) => {
                const option = document.createElement("option");
                option.textContent = context;
                option.value = context;
                dropdown.appendChild(option);
            });
    
            dropdown.addEventListener("change", (event) => {
                currentContext = event.target.value || null;
    
                if (currentContext) {
                    console.log(`Selected context: ${currentContext}`);
                    showCategory("Relatedness"); // Default category to show
                } else {
                    console.log("No context selected.");
                    const contentDiv = document.getElementById('inventoryContent');
                    contentDiv.innerHTML = ''; // Clear the table
                }
            });
    
            container.appendChild(dropdown);
        }
    
        function showCategory(category) {
            if (!currentContext) {
                alert("Please select a context first.");
                return;
            }
    
            const contentDiv = document.getElementById('inventoryContent');
            contentDiv.innerHTML = '';
    
            const items = inventoryData.contexts[currentContext][category] || [];
            items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'tableRow';
    
                const cell = document.createElement('div');
                cell.className = 'tableCell';
                cell.textContent = item;
    
                const editButton = document.createElement('button');
                editButton.className = 'actionButton';
                editButton.textContent = 'Edit';
                editButton.onclick = () => openEditPopup(item, category, index);
    
                const deleteButton = document.createElement('button');
                deleteButton.className = 'actionButton';
                deleteButton.textContent = 'Delete';
                deleteButton.onclick = () => deleteItem(category, index);
    
                row.appendChild(cell);
                row.appendChild(editButton);
                row.appendChild(deleteButton);
    
                contentDiv.appendChild(row);
            });
    
            const addButton = document.createElement('button');
            addButton.className = 'actionButton';
            addButton.textContent = 'Add';
            addButton.onclick = () => addItem(category);
            contentDiv.appendChild(addButton);
        }
    
        function addItem(category) {
            if (!currentContext) {
                alert("Please select a context first.");
                return;
            }
    
            const newItem = prompt("Enter the new item name:");
            if (newItem && newItem.trim()) {
                inventoryData.contexts[currentContext][category].push(newItem.trim());
                showCategory(category);
            }
        }
    
        function deleteItem(category, index) {
            if (!currentContext) {
                alert("Please select a context first.");
                return;
            }
    
            const confirmDelete = confirm(`Are you sure you want to delete "${inventoryData.contexts[currentContext][category][index]}"?`);
            if (confirmDelete) {
                inventoryData.contexts[currentContext][category].splice(index, 1);
                showCategory(category);
            }
        }
    
        createDropdown(); // Initialize the dropdown
    </script>
    
</body>
