<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Lora', serif;
            background-color: #333;
            color: #ffaa00;
            margin: 0;
            padding: 0;
        }

        #tableheader {
            background-color: #333;
            font-color: #ffaa00;
            font-family: 'Lora', serif;
        }

        #buttons {
            z-index: 10;
            width: 100vw;
            height: auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 0;
        }

        .tab {
            overflow: hidden;
            border: 1px solid #ffaa00;
            background-color: #444444;
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            color: #ffaa00;
        }

        .tableMain {
            display: table;
            width: 100%;
            background-color: #333333;
        }

        .tableRow {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid #ffaa00;
        }

        .tableCell {
            flex: 1;
            padding-left: 5px;
        }

        .actionButton {
            background-color: #ffaa00;
            border: none;
            padding: 5px 10px;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }

        .actionButton:hover {
            background-color: #ffcc33;
        }

        #popupForm {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #popupContent {
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #ffaa00;
            width: 300px;
        }

        #popupContent input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ffaa00;
            border-radius: 5px;
        }

        #popupContent button {
            padding: 10px 20px;
            background-color: #ffaa00;
            border: none;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
        }

        #popupContent button:hover {
            background-color: #ffcc33;
        }
    </style>
</head>
<body>
    <div id="popupForm">
        <div id="popupContent">
            <h2>Enter Details</h2>
            <label for="gardenInput">Garden/Context:</label><br>
            <input type="text" id="gardenInput" placeholder="Enter Garden/Context"><br>
            <label for="treeInput">Situation/Tree:</label><br>
            <input type="text" id="treeInput" placeholder="Enter Situation/Tree"><br>
            <button onclick="submitPopup()">Submit</button>
        </div>
    </div>

    <div class="tableMain">
        <div class="tableBody">
            <div id="garden">Context/Garden</div>
            <div id="tree">Situation/Tree</div>            
            <div class="tab">
                <button class="tablinks" onclick="showCategory('Spells')">Spells</button>
                <button class="tablinks" onclick="showCategory('Flowers')">Flowers</button>
                <button class="tablinks" onclick="showCategory('Fruits')">Fruits</button>
            </div>
            <div id="inventoryContent" class="tableBody"></div>
        </div>
    </div>
    <div id="buttons">
        <button>History</button>
    </div>

    <script>
        const inventoryData = {
            "inventory": {
                "Spells": ["Car Key", "House Key", "Safe Key"],
                "Flowers": ["Rose", "Tulip", "Lily"],
                "Fruits": ["Apple", "Banana", "Cherry"]
            }
        };

        function showCategory(category) {
        const contentDiv = document.getElementById('inventoryContent');
        contentDiv.innerHTML = '';

        const items = inventoryData.inventory[category] || [];
        items.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'tableRow';

            const cell = document.createElement('div');
            cell.className = 'tableCell';
            cell.textContent = item;

            // Add the Reachable checkbox only for Spells
            if (category === 'Spells') {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `reachable-${index}`;
                checkbox.className = 'reachableCheckbox';

                const checkboxLabel = document.createElement('label');
                checkboxLabel.textContent = 'Reachable';
                checkboxLabel.setAttribute('for', `reachable-${index}`);

                const checkboxContainer = document.createElement('div');
                checkboxContainer.appendChild(checkbox);
                checkboxContainer.appendChild(checkboxLabel);

                row.appendChild(checkboxContainer);
            }

            const deleteButton = document.createElement('button');
            deleteButton.className = 'actionButton';
            deleteButton.textContent = 'Delete';
            deleteButton.onclick = () => deleteItem(category, index);

            row.appendChild(cell);
            row.appendChild(deleteButton);
            contentDiv.appendChild(row);
        });

        const addButton = document.createElement('button');
        addButton.className = 'actionButton';
        addButton.textContent = 'Add';
        addButton.onclick = () => addItem(category);

        contentDiv.appendChild(addButton);
    }
    
    function addItem(category) {
            const newItem = prompt(`Add a new item to ${category}:`);
            if (newItem) {
                inventoryData.inventory[category].push(newItem);
                showCategory(category);
            }
        }

        function deleteItem(category, index) {
            inventoryData.inventory[category].splice(index, 1);
            showCategory(category);
        }

        window.onload = function () {
            document.getElementById('popupForm').style.display = 'flex';
        };

        function submitPopup() {
            const gardenInput = document.getElementById('gardenInput').value;
            const treeInput = document.getElementById('treeInput').value;

            if (gardenInput && treeInput) {
                document.getElementById('garden').textContent = gardenInput;
                document.getElementById('tree').textContent = treeInput;
                document.getElementById('popupForm').style.display = 'none';
            } else {
                alert('Please fill in both fields.');
            }
        }

        showCategory('Spells');
    </script>
</body>
</html>
