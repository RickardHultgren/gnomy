    <script>


function createDatabase(inventoryData, situationData) {
    const database = {};
    let currentId = 1;

    // Add items from inventoryData
    for (const category in inventoryData.inventory) {
        for (const item of inventoryData.inventory[category]) {
            database[currentId] = item;
            currentId++;
        }
    }

    // Add items from situationData
    for (const context in situationData.contexts) {
        for (const item of situationData.contexts[context]) {
            database[currentId] = item;
            currentId++;
        }
    }

    return database;
}

// Input Data
const inventoryData = {
    "inventory": {
        "Relatedness": ["Rose", "Tulip", "Lily"],
        "Competence": ["Apple", "Banana", "Cherry"],
        "Autonomy": ["Car Key", "House Key", "Safe Key"]
    }
};

const situationData = {
    "contexts": {
        "Home": ["Economy", "Food", "Cleaning"],
        "Work": ["Challenges", "Resources"],
        "Hobby": ["Football", "Painting"]
    }
};

// Create the database
const database = createDatabase(inventoryData, situationData);
console.log(database);

const sliders = {}; // Store sliders for each situation

function addSliderInevitable(situation) {
    const sliderContainer = document.createElement('div');
    sliderContainer.classList.add('slider-container');  // Add class for styling
    sliderContainer.id = `slider-${situation}`; // Unique ID for each slider

    const leftText = document.createElement('span');
    leftText.classList.add('slider-left-text');  // Add class for styling
    leftText.textContent = 'Inevitable';

    const slider = document.createElement('input');
    slider.classList.add('slider');  // Add class for styling
    slider.type = 'range';
    slider.min = '1';
    slider.max = '5';
    slider.value = '3'; // Default value
    slider.style.margin = '0 10px';

    const rightText = document.createElement('span');
    rightText.classList.add('slider-right-text');  // Add class for styling
    rightText.textContent = 'By choice';

    sliderContainer.appendChild(leftText);
    sliderContainer.appendChild(slider);
    sliderContainer.appendChild(rightText);

    sliders[situation] = sliderContainer; // Store the slider container
}

function updateDropdowns(contextDropdown, situationDropdown, selectedContext) {
    // Clear and update the situation dropdown
    situationDropdown.innerHTML = "";
    const defaultOption = document.createElement("option");
    defaultOption.textContent = "Select a situation...";
    defaultOption.value = "";
    situationDropdown.appendChild(defaultOption);

    if (selectedContext && situationData.contexts[selectedContext]) {
        situationData.contexts[selectedContext].forEach((situation) => {
            const option = document.createElement("option");
            option.classList.add('situation-option');  // Add class for styling
            option.textContent = situation;
            option.value = situation;
            situationDropdown.appendChild(option);

            // Create a slider for each situation if not already created
            if (!sliders[situation]) {
                addSliderInevitable(situation);
            }
        });
    }
}

function createDropdowns() {
    const container = document.getElementById("contexts");

    // Context dropdown
    const contextDropdown = document.createElement("select");
    contextDropdown.classList.add('context-dropdown');  // Add class for styling
    contextDropdown.id = "contextDropdown";
    const defaultContextOption = document.createElement("option");
    defaultContextOption.textContent = "Select a context...";
    defaultContextOption.value = "";
    contextDropdown.appendChild(defaultContextOption);
    Object.keys(situationData.contexts).forEach((context) => {
        const option = document.createElement("option");
        option.classList.add('context-option');  // Add class for styling
        option.textContent = context;
        option.value = context;
        contextDropdown.appendChild(option);
    });
    container.appendChild(contextDropdown);

    // Situation dropdown
    const situationDropdown = document.createElement("select");
    situationDropdown.classList.add('situation-dropdown');  // Add class for styling
    situationDropdown.id = "situationDropdown";
    const defaultSituationOption = document.createElement("option");
    defaultSituationOption.textContent = "Select a situation...";
    defaultSituationOption.value = "";
    situationDropdown.appendChild(defaultSituationOption);
    container.appendChild(situationDropdown);

    // Slider container
    const sliderContainer = document.createElement("div");
    sliderContainer.classList.add('slider-container');  // Add class for styling
    sliderContainer.id = "sliderContainer";
    container.appendChild(sliderContainer);

    // Add Context Button
    const addContextButton = document.createElement("button");
    addContextButton.classList.add('add-context-button');  // Add class for styling
    addContextButton.textContent = "Add Context";
    container.appendChild(addContextButton);

    // Add Situation Button
    const addSituationButton = document.createElement("button");
    addSituationButton.classList.add('add-situation-button');  // Add class for styling
    addSituationButton.textContent = "Add Situation";
    container.appendChild(addSituationButton);

    // Delete Context Button
    const deleteContextButton = document.createElement("button");
    deleteContextButton.classList.add('delete-context-button');  // Add class for styling
    deleteContextButton.textContent = "Delete Context";
    container.appendChild(deleteContextButton);

    // Delete Situation Button
    const deleteSituationButton = document.createElement("button");
    deleteSituationButton.classList.add('delete-situation-button');  // Add class for styling
    deleteSituationButton.textContent = "Delete Situation";
    container.appendChild(deleteSituationButton);

    // Context dropdown change listener
    contextDropdown.addEventListener("change", (event) => {
        const selectedContext = event.target.value;
        updateDropdowns(contextDropdown, situationDropdown, selectedContext);
    });

    // Situation dropdown change listener
    situationDropdown.addEventListener("change", (event) => {
        const selectedSituation = event.target.value;
        const sliderContainerDiv = document.getElementById("sliderContainer");
        sliderContainerDiv.innerHTML = ""; // Clear previous slider
        if (sliders[selectedSituation]) {
            sliderContainerDiv.appendChild(sliders[selectedSituation]);
        }
    });

    // Add Context Button Listener
    addContextButton.addEventListener("click", () => {
        const newContextName = prompt("Enter a name for the new context:");
        if (newContextName && !situationData.contexts[newContextName]) {
            situationData.contexts[newContextName] = [];
            const option = document.createElement("option");
            option.classList.add('context-option');  // Add class for styling
            option.textContent = newContextName;
            option.value = newContextName;
            contextDropdown.appendChild(option);
            contextDropdown.value = newContextName;
            updateDropdowns(contextDropdown, situationDropdown, newContextName);
        } else if (situationData.contexts[newContextName]) {
            alert("This context already exists.");
        }
    });

    // Add Situation Button Listener
    addSituationButton.addEventListener("click", () => {
        const selectedContext = contextDropdown.value;
        if (!selectedContext) {
            alert("Please select a context first.");
            return;
        }
        const newSituationName = prompt("Enter a name for the new situation:");
        if (newSituationName && !situationData.contexts[selectedContext].includes(newSituationName)) {
            situationData.contexts[selectedContext].push(newSituationName);
            updateDropdowns(contextDropdown, situationDropdown, selectedContext);
        } else if (situationData.contexts[selectedContext].includes(newSituationName)) {
            alert("This situation already exists in the selected context.");
        }
    });

    // Delete Context Button Listener
    deleteContextButton.addEventListener("click", () => {
        const selectedContext = contextDropdown.value;
        if (!selectedContext) {
            alert("Please select a context to delete.");
            return;
        }
        const confirmDelete = confirm(`Are you sure you want to delete the context "${selectedContext}"?`);
        if (confirmDelete) {
            delete situationData.contexts[selectedContext];
            contextDropdown.innerHTML = "";
            const defaultOption = document.createElement("option");
            defaultOption.textContent = "Select a context...";
            defaultOption.value = "";
            contextDropdown.appendChild(defaultOption);
            Object.keys(situationData.contexts).forEach((context) => {
                const option = document.createElement("option");
                option.classList.add('context-option');  // Add class for styling
                option.textContent = context;
                option.value = context;
                contextDropdown.appendChild(option);
            });
            updateDropdowns(contextDropdown, situationDropdown, "");
        }
    });

    // Delete Situation Button Listener
    deleteSituationButton.addEventListener("click", () => {
        const selectedContext = contextDropdown.value;
        const selectedSituation = situationDropdown.value;
        if (!selectedContext) {
            alert("Please select a context first.");
            return;
        }
        if (!selectedSituation) {
            alert("Please select a situation to delete.");
            return;
        }
        const confirmDelete = confirm(`Are you sure you want to delete the situation "${selectedSituation}" from the "${selectedContext}" context?`);
        if (confirmDelete) {
            const index = situationData.contexts[selectedContext].indexOf(selectedSituation);
            if (index !== -1) {
                situationData.contexts[selectedContext].splice(index, 1);
                updateDropdowns(contextDropdown, situationDropdown, selectedContext);
            }
        }
    });
}
// Initialize the dropdowns and buttons
createDropdowns();

function createDropdown() {
    // Get the container div
    const container = document.getElementById("contexts");

    // Create a dropdown element
    const dropdown = document.createElement("select");
    dropdown.id = "contextDropdown";

    // Create a default option
    const defaultOption = document.createElement("option");
    defaultOption.textContent = "Select a context...";
    defaultOption.value = "";
    dropdown.appendChild(defaultOption);

    // Populate the dropdown with options from contextData
    contextData.Context.forEach((context, index) => {
        const option = document.createElement("option");
        option.textContent = context;
        option.value = index; // Use index as value to track the selected context
        dropdown.appendChild(option);
    });

    // Add an event listener to handle selection changes
    dropdown.addEventListener("change", (event) => {
        currentContextIndex = event.target.value !== "" ? parseInt(event.target.value) : null;

        if (currentContextIndex !== null) {
            console.log(`Selected context: ${contextData.Context[currentContextIndex]}`);
        } else {
            console.log("No context selected.");
        }
    });

    // Append the dropdown to the container
    container.appendChild(dropdown);
}

function markAsCurrentLocation(item, row) {
    // Remove existing "current location" label
    const previousCurrent = document.querySelector('.current-location');
    if (previousCurrent) {
        previousCurrent.classList.remove('current-location');
        previousCurrent.querySelector('.current-label').remove();
    }

    // Add "current location" label to this row
    row.classList.add('current-location');
    const currentLabel = document.createElement('span');
    currentLabel.className = 'current-label';
    currentLabel.style.marginLeft = '10px';
    currentLabel.textContent = ' (Current Location)';
    row.querySelector('.tableCell').appendChild(currentLabel);
}

function deleteItem(category, index) {
    // Confirm the delete action with the user
    const confirmDelete = confirm(`Are you sure you want to delete "${inventoryData.inventory[category][index]}"?`);
    if (confirmDelete) {
        // Remove the item from the inventory
        inventoryData.inventory[category].splice(index, 1);
        // Refresh the displayed category
        showCategory(category);
    }
}

</script>    

<script>
function openEditPopup(item, category, index) {
    // Display the popup
    const editPopup = document.getElementById('editPopup');
    editPopup.style.display = 'flex';

    // Set the current item's name in the input field
    const editItemInput = document.getElementById('editItemInput');
    editItemInput.value = item;

    // Save the category and index for reference
    editPopup.dataset.category = category;
    editPopup.dataset.index = index;
}

function submitEdit() {
    const editPopup = document.getElementById('editPopup');
    const category = editPopup.dataset.category;
    const index = parseInt(editPopup.dataset.index, 10);

    const editItemInput = document.getElementById('editItemInput');
    const newItemName = editItemInput.value.trim();

    if (newItemName) {
        // Update the inventory with the new name
        inventoryData.inventory[category][index] = newItemName;

        // Close the popup
        closeEditPopup();

        // Refresh the displayed category
        showCategory(category);
    } else {
        alert("Item name cannot be empty.");
    }
}

function closeEditPopup() {
    const editPopup = document.getElementById('editPopup');
    editPopup.style.display = 'none';
}


</script>
<script>
    function addSliderPersonal(row) {
        const sliderContainer = document.createElement('div');
        sliderContainer.style.display = 'flex';
        sliderContainer.style.alignItems = 'center';
        sliderContainer.style.gap = '10px';

        const leftText = document.createElement('span');
        leftText.textContent = 'Related to yourself';

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '1';
        slider.max = '5';
        slider.value = '3'; // Default value
        slider.style.margin = '0 10px';

        const rightText = document.createElement('span');
        rightText.textContent = 'Related to others';

        sliderContainer.appendChild(leftText);
        sliderContainer.appendChild(slider);
        sliderContainer.appendChild(rightText);

        row.appendChild(sliderContainer);
    }

    function showCategory(category) {
        const contentDiv = document.getElementById('inventoryContent');
        contentDiv.innerHTML = '';
    
        // Clear active class from all headers
        const tabButtons = document.querySelectorAll('.tab button');
        tabButtons.forEach((button) => button.classList.remove('active-header'));
    
        // Set active class for the clicked header
        const activeButton = [...tabButtons].find((button) => button.textContent === category);
        if (activeButton) {
            activeButton.classList.add('active-header');
        }
    
        const items = inventoryData.inventory[category] || [];
        items.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'tableRow';

            const row2 = document.createElement('div');
            row2.className = 'tableRow2';

            const row3 = document.createElement('div');
            row3.className = 'tableRow3';

            const row4 = document.createElement('div');
            row4.className = 'tableRow4';

            const row5 = document.createElement('div');
            row5.className = 'tableRow5';
            
            const cell = document.createElement('div');
            cell.className = 'tableCell';
            cell.textContent = item;

            const editButton = document.createElement('button');
            editButton.className = 'actionButton';
            editButton.textContent = 'Edit';
            editButton.onclick = () => openEditPopup(item, category, index);
    
            const deleteButton = document.createElement('button');
            deleteButton.className = 'actionButton';
            deleteButton.textContent = 'Delete';
            deleteButton.onclick = () => deleteItem(category, index);
    
            row.appendChild(cell);
            row.appendChild(editButton);
            row.appendChild(deleteButton);
    
            contentDiv.appendChild(row);            
            contentDiv.appendChild(row2);     
            contentDiv.appendChild(row3);     
            contentDiv.appendChild(row4);     
            contentDiv.appendChild(row5);     

            if (category === 'Autonomy') {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `reachable-${index}`;
                checkbox.className = 'reachableCheckbox';
    
                const label = document.createElement('label');
                label.textContent = 'Reachable';
                label.setAttribute('for', `reachable-${index}`);
    
                const container = document.createElement('div');
                container.appendChild(checkbox);
                container.appendChild(label);
    
                row.appendChild(container);
    
                checkbox.addEventListener('change', function () {
                    const existingButton = document.getElementById(`go-there-${index}`);
                    if (checkbox.checked) {
                        if (!existingButton) {
                            const goThereButton = document.createElement('button');
                            goThereButton.className = 'actionButton';
                            goThereButton.textContent = 'Go There';
                            goThereButton.id = `go-there-${index}`;
                            goThereButton.onclick = () => markAsCurrentLocation(item, row);
                            row.appendChild(goThereButton);
                        }
                    } else {
                        if (existingButton) {
                            existingButton.remove();
                        }
                    }
                });
            }
            if (category === 'Relatedness') {
                addSliderPersonal(row2);
                //addSliderInevitable(row3);

                const goalcheckbox = document.createElement('input');
                goalcheckbox.type = 'checkbox';
                goalcheckbox.id = `goal-${index}`;
                goalcheckbox.className = 'goalCheckbox';
    
                const goallabel = document.createElement('label');
                goallabel.textContent = 'goal';
                goallabel.setAttribute('for', `goal-${index}`);

                goalcheckbox.id = `goal-${index}`;
                goalcheckbox.className = 'goalCheckbox';
                
                const goalcontainer = document.createElement('div');
                goalcontainer.appendChild(goalcheckbox);
                goalcontainer.appendChild(goallabel);
                goalcontainer.className = 'goalcontainer';
                row4.appendChild(goalcontainer);    




                const feelingcheckbox = document.createElement('input');
                feelingcheckbox.type = 'checkbox';
                feelingcheckbox.id = `feeling-${index}`;
                feelingcheckbox.className = 'feelingCheckbox';
    
                const feelinglabel = document.createElement('label');
                feelinglabel.textContent = 'feeling';
                feelinglabel.setAttribute('for', `feeling-${index}`);

                feelingcheckbox.id = `feeling-${index}`;
                feelingcheckbox.className = 'feelingCheckbox';
                
                const feelingcontainer = document.createElement('div');
                feelingcontainer.appendChild(feelingcheckbox);
                feelingcontainer.appendChild(feelinglabel);
                feelingcontainer.className = 'feelingcontainer';
                row5.appendChild(feelingcontainer);    

                
            }

        });
    
        const addButton = document.createElement('button');
        addButton.className = 'actionButton';
        addButton.textContent = 'Add';
        addButton.onclick = () => addItem(category);
    
        contentDiv.appendChild(addButton);
    }

function markAsCurrentLocation(item, row) {
    // Remove existing "current location" label
    const previousCurrent = document.querySelector('.current-location');
    if (previousCurrent) {
        previousCurrent.classList.remove('current-location');
        const currentLabel = previousCurrent.querySelector('.current-label');
        if (currentLabel) {
            currentLabel.remove();
        }
    }
}

    // Add "current location" label to this row
    row.classList.add('current-location');
    const currentLabel = document.createElement('span');
    currentLabel.className = 'current-label';
    currentLabel.style.marginLeft = '10px';
    currentLabel.textContent = ' (Current Location)';
    row.querySelector('.tableCell').appendChild(currentLabel);

    // Update the "current" div with the selected item's name
    const currentDiv = document.getElementById('current');
    currentDiv.textContent = `Current Location: ${item}`;


    </script>


</body>
</html>
