    <style>
        html, body {
            font-family: 'Lora', serif;
            background-color: #333;
            color: #ffaa00;
            margin: 0;
            padding: 0;
        }
    
        #tableheader {
            background-color: #333;
            color: #ffaa00;
        }
    
        #buttons {
            z-index: 10;
            width: 100%;
            height: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
    
        .tab {
            overflow: hidden;
            border: 1px solid #ffaa00;
            background-color: #444444;
        }
    
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            color: #ffaa00;
        }
    
        .tab button:hover {
            background-color: #555555;
        }
    
        .tableMain {
            display: block;
            width: 100%;
            background-color: #333333;
        }
    
        .tableRow {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid #ffaa00;
        }
    
        .tableCell {
            flex: 1;
            padding-left: 5px;
        }
    
        .actionButton {
            background-color: #ffaa00;
            border: none;
            padding: 8px 12px;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
    
        .actionButton:hover {
            background-color: #ffcc33;
        }
    
        #popupForm, #addItemPopup, #editPopup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
    
        #popupContent, #addItemContent, #editPopupContent {
            background-color: #444;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            color: #ffaa00;
            width: 90%;
            max-width: 400px;
        }
    
        #popupContent input, #addItemContent input, #editPopupContent input {
            width: 95%;
            padding: 0.8rem;
            margin: 10px 0;
            border: 1px solid #ffaa00;
            border-radius: 5px;
            font-size: 1.5rem;
        }
    
        #popupContent button, #addItemContent button, #editPopupContent button {
            padding: 0.8rem 1.5rem;
            background-color: #ffaa00;
            border: none;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.5rem;
        }
    
        #popupContent button:hover, #addItemContent button:hover, #editPopupContent button:hover {
            background-color: #ffcc33;
        }
    
        /* Responsive Adjustments */
        @media screen and (max-width: 864px) {
            body{
                font-size:2rem;
            }
            .tableRow {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
    
            .tableCell {
                padding: 5px 0;
                text-align: center;
            }
    
            .tab button {
                font-size: 0.9rem;
                padding: 10px;
            }
    
            #buttons {
                flex-direction: column;
                padding: 10px;
            }
    
            .actionButton {
                padding: 10px;
                margin: 5px;
                font-size: 0.9rem;
            }
    
            #popupContent, #addItemContent, #editPopupContent {
                padding: 1rem;
                width: 90%;
                max-width: 320px;
            }
    
            #popupContent input, #addItemContent input, #editPopupContent input {
                font-size: 0.9rem;
            }
        }
    
        @media screen and (max-width: 480px) {
            body{
                font-size:2rem;
            }
            .tableRow {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }

                padding: 5px 0;
                text-align: center;

            }
    
            #popupContent, #addItemContent, #editPopupContent {
                padding: 1rem;

            }
    
            #popupContent input, #addItemContent input, #editPopupContent input {
                font-size: 0.9rem;
            }            
            .tab button {
                padding: 8px;
                font-size: 2.5rem;
            }
    
            .actionButton {
                font-size: 2.5rem;
                padding: 8px 10px;
            }
    
            #popupContent, #addItemContent, #editPopupContent {
                padding: 2.5rem;
            }
    
            #popupContent input, #addItemContent input, #editPopupContent input {

</head>
<body>
    <div id="popupForm">
        <div id="popupContent">
            <h2>Enter Details</h2>
            <label for="gardenInput">Garden/Context:</label><br>
            <input type="text" id="gardenInput" placeholder="Enter Garden/Context"><br>
            <label for="treeInput">Situation/Tree:</label><br>
            <input type="text" id="treeInput" placeholder="Enter Situation/Tree"><br>
            <button onclick="submitPopup()">Submit</button>
        </div>
    </div>

    <div id="addItemPopup">
        <div id="addItemContent">
            <h2>Add New Item</h2>
            <label for="newItemInput">Item Name:</label><br>
            <input type="text" id="newItemInput" placeholder="Enter item name"><br>
            <button onclick="submitNewItem()">Add Item</button>
            <button onclick="closeAddItemPopup()">Cancel</button>
        </div>
    </div>

    <div id="editPopup">
        <div id="editPopupContent">
            <h2>Edit Item</h2>
            <label for="editItemInput">Item Name:</label><br>
            <input type="text" id="editItemInput" placeholder="Enter new name"><br>
            <button onclick="submitEdit()">Save</button>
            <button onclick="closeEditPopup()">Cancel</button>
        </div>
    </div>

    <div class="tableMain">
        <div class="tableBody">
            <div id="garden">Context/Garden</div>
            
            <div id="tree">Situation/Tree</div>
            <button class="actionButton" onclick="document.getElementById('popupForm').style.display = 'flex';">Edit</button>
            <div class="tab">
                <button class="tablinks" onclick="showCategory('Spells')">Spells</button>
                <button class="tablinks" onclick="showCategory('Flowers')">Flowers</button>
                <button class="tablinks" onclick="showCategory('Fruits')">Fruits</button>
            </div>
            <div id="inventoryContent" class="tableBody"></div>
        </div>
    </div>
    <div id="buttons">
        <button>History</button>
    </div>

    <script>
        const inventoryData = {
            "inventory": {
                "Spells": ["Car Key", "House Key", "Safe Key"],
                "Flowers": ["Rose", "Tulip", "Lily"],
                "Fruits": ["Apple", "Banana", "Cherry"]
            }
        };

        let currentCategory = '';
        let editTarget = '';

        function showCategory(category) {
            const contentDiv = document.getElementById('inventoryContent');
            contentDiv.innerHTML = '';

            const items = inventoryData.inventory[category] || [];
            items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'tableRow';

                const cell = document.createElement('div');
                cell.className = 'tableCell';
                cell.textContent = item;

                if (category === 'Spells') {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `reachable-${index}`;
                    checkbox.className = 'reachableCheckbox';

                    const label = document.createElement('label');
                    label.textContent = 'Reachable';
                    label.setAttribute('for', `reachable-${index}`);

                    const container = document.createElement('div');
                    container.appendChild(checkbox);
                    container.appendChild(label);

                    row.appendChild(container);
                }

                const editButton = document.createElement('button');
                editButton.className = 'actionButton';
                editButton.textContent = 'Edit';
                editButton.onclick = () => openEditPopup(item, category, index);

                const deleteButton = document.createElement('button');
                deleteButton.className = 'actionButton';
                deleteButton.textContent = 'Delete';
                deleteButton.onclick = () => deleteItem(category, index);

                row.appendChild(cell);
                row.appendChild(editButton);
                row.appendChild(deleteButton);

                contentDiv.appendChild(row);
            });

            const addButton = document.createElement('button');
            addButton.className = 'actionButton';
            addButton.textContent = 'Add';
            addButton.onclick = () => addItem(category);

            contentDiv.appendChild(addButton);
        }

        function addItem(category) {
            currentCategory = category;
            document.getElementById('addItemPopup').style.display = 'flex';
        }

        function submitNewItem() {
            const newItem = document.getElementById('newItemInput').value;
            if (newItem.trim()) {
                inventoryData.inventory[currentCategory].push(newItem);
                showCategory(currentCategory);
                closeAddItemPopup();
            }
        }

        function closeAddItemPopup() {
            document.getElementById('addItemPopup').style.display = 'none';
        }

        function deleteItem(category, index) {
            inventoryData.inventory[category].splice(index, 1);
            showCategory(category);
        }

        function openEditPopup(item, category, index) {
            editTarget = { item, category, index };
            document.getElementById('editItemInput').value = item;
            document.getElementById('editPopup').style.display = 'flex';
        }

        function submitEdit() {
            const newName = document.getElementById('editItemInput').value;
            if (newName.trim()) {
                const { category, index } = editTarget;
                inventoryData.inventory[category][index] = newName;
                showCategory(category);
                closeEditPopup();
            }
        }

        function closeEditPopup() {
            document.getElementById('editPopup').style.display = 'none';
        }

        function submitPopup() {
            const gardenInput = document.getElementById('gardenInput').value;
            const treeInput = document.getElementById('treeInput').value;

            if (gardenInput && treeInput) {
                document.getElementById('garden').textContent = gardenInput;
                document.getElementById('tree').textContent = treeInput;
                document.getElementById('popupForm').style.display = 'none';
            }
        }

        showCategory('Spells');
    </script>
       <script>
        // Variables to track the currently edited item
        let currentEditElementId = "";

        // Function to open the popup for editing
        function editItem(elementId) {
            currentEditElementId = elementId;
            const currentText = document.getElementById(elementId).textContent;
            document.getElementById('editInput').value = currentText; // Populate the input with current text
            document.getElementById('popupForm').style.display = 'flex';
        }

        // Function to save the edited value
        function saveEdit() {
            const newValue = document.getElementById('editInput').value.trim();
            if (newValue) {
                document.getElementById(currentEditElementId).textContent = newValue; // Update the text content
                closePopup();
            } else {
                alert("Please enter a valid name.");
            }
        }

        // Function to close the popup without saving
        function closePopup() {
            document.getElementById('popupForm').style.display = 'none';
            currentEditElementId = ""; // Reset the current edit element
        }
    </script>
</body>
</html>
