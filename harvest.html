<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot, Fruits, and Breathing Text</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      background-color: #f0f0f0;
      border-image-slice:    42 42 42 42;
    border-image-width:    42px 42px 42px 42px;
    border-image-outset:    .5em .5em .5em .5em;
    border-image-repeat:    round round;
    border-image-source:    url("border.svg");
    border-style:    solid;  
 
    background: #3f5c38; /* Base green for the lawn */
    background-image: 
      /* Small, irregular dots for detailed grass texture */
      radial-gradient(circle, #547c54 1px, transparent 0), 
      radial-gradient(circle, #4f7949 1px, transparent 0),
      radial-gradient(circle, #6a7247 1px, transparent 0),
      radial-gradient(circle, #4d6a3d 1px, transparent 0),
      radial-gradient(circle, #626e4b 2px, transparent 0),
      
      /* Medium-sized patches for natural variation */
      radial-gradient(circle, #5b7743 3px, transparent 0),
      radial-gradient(circle, #4f6d3f 3px, transparent 0),
      radial-gradient(circle, #506838 4px, transparent 0),
      radial-gradient(circle, #717556 4px, transparent 0),
      
      /* Larger blades and irregular shapes for layering */
      radial-gradient(ellipse at top left, rgba(50, 80, 50, 0.8) 30%, transparent 60%), 
      radial-gradient(ellipse at bottom right, rgba(92, 128, 81, 0.6) 20%, transparent 50%),
      radial-gradient(ellipse at center, rgba(98, 126, 98, 0.5) 40%, transparent 70%),
      
      /* Linear gradient for overall shading and depth */
      linear-gradient(135deg, #567046, #3f5c38, #2f4b2e);
    
    /* Sizes adjusted for irregular, interwoven effect */
    background-size: 
      0.2em 0.2em, 
      .25em .25em, 
      .3em .3em, 
      .35em .35em, 
      1.5em 1.5em, 
      0.75em 0.75em, 
      .5em .5em, 
      0.88em 0.88em, 
      .5em .5em, 
      .25em .25em, 
      100% 100%; /* Full coverage for shading */
    
    /* Positions randomized for natural look */
    background-position: 
      0 0, 
      0.5em 1em, 
      1.5em -0.5em, 
      -1em 0.5em, 
      2em 2em, 
      -3em -2em, 
      2em -2em, 
      -1.5em 1em, 
      1em -1em, 
      0 0;

    }
    canvas {
        z-index: 3; /* Ensure the bush is behind the canvas */
      display: block;
      color: #fff;
  text-align: center;
  -webkit-animation: glow 1s ease-in-out infinite alternate;
  -moz-animation: glow 1s ease-in-out infinite alternate;
  animation: glow 1s ease-in-out infinite alternate;
    }
    .bush {
      pointer-events: none;
      position: absolute;
      /*z-index: -1; /* Ensure the bush is behind the canvas */
      z-index: 2; /* Ensure the bush is behind the canvas */
      width: 200px; /* Match circle diameter */
      height: 200px; /* Match circle diameter */
      background: url('bush.png') no-repeat center center;
      background-size: cover;
      top: calc(50% - 100px); /* Center the bush */
      left: calc(50% - 100px); /* Center the bush */
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bush"></div>
    <canvas id="circleCanvas"></canvas>

  <script>
    const logoWidth = 50;  // Adjust size as needed
    const logoHeight = 50;
    const canvas = document.getElementById('circleCanvas');
    const ctx = canvas.getContext('2d');

    // Set canvas size to window size
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 100; // Radius of the circle

    let dotAngle = 0; // Initial angle for the dot
    let fruitAngle = 0; // Initial angle for the fruit (top of the circle)
    let fruitTurn = 1; // Tracks the fruit cycle (1 = Inhale, 2 = Hold, 3 = Exhale)
    let isDragging = false; // Track if the user is interacting
    let fruitSize = 0; // Initial size of the fruit
    const fruitGrowthRate = 2; // Pixels per second
    let lastTimestamp = null; // For tracking time

    function drawCircle() {
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const gnomyLogo = new Image();
    gnomyLogo.src = 'GnomyLogo.png'; // Path to your Gnomy logo image

    function drawDot() {
        const dotX = centerX + radius * Math.cos(dotAngle) - logoWidth / 2;
        const dotY = centerY + radius * Math.sin(dotAngle) - logoHeight / 2;

        // Draw the image if it's loaded
        if (gnomyLogo.complete) {
            ctx.drawImage(gnomyLogo, dotX, dotY, logoWidth, logoHeight);
        }
    }

    function drawFruit() {
      const fruitX = centerX + radius * Math.cos(fruitAngle);
      const fruitY = centerY + radius * Math.sin(fruitAngle);

      ctx.beginPath();
      ctx.arc(fruitX, fruitY, fruitSize, 0, Math.PI * 2);
      ctx.fillStyle = '#ff8800';
      ctx.fill();
    }

    function drawText() {
  ctx.font = '20px Lora'; // Use Lora font
  ctx.fillStyle = "white";
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Main text for breathing phase
  const mainText = fruitTurn === 1 
    ? 'Inhale' 
    : fruitTurn === 2 
    ? 'Hold' 
    : 'Exhale';

  // Counter rounded down to whole seconds
  const timeRemaining = fruitTurn === 1 
    ? 4 - Math.floor(fruitSize) 
    : fruitTurn === 2 
    ? 7 - Math.floor(fruitSize) 
    : 8 - Math.floor(fruitSize);

  // Draw main text at the center
  ctx.fillText(mainText, centerX, centerY - 20);

  // Draw timer on a new line
  ctx.fillText(`${timeRemaining} seconds`, centerX, centerY + 20);
}

function checkCollision() {
    const dotX = centerX + radius * Math.cos(dotAngle);
    const dotY = centerY + radius * Math.sin(dotAngle);
    const fruitX = centerX + radius * Math.cos(fruitAngle);
    const fruitY = centerY + radius * Math.sin(fruitAngle);

    const distance = Math.sqrt((dotX - fruitX) ** 2 + (dotY - fruitY) ** 2);
    const threshold = fruitSize + 10; // Adjust collision threshold

    return distance < threshold;
}



    function updateFruitSize(timestamp) {
      if (!lastTimestamp) {
        lastTimestamp = timestamp;
        return;
      }
      const deltaTime = (timestamp - lastTimestamp) / 1000; // Convert to seconds
      lastTimestamp = timestamp;

      if (fruitSize < 4 && fruitTurn===1) {
        fruitSize += fruitGrowthRate * deltaTime;
      }

      if (fruitSize < 7 && fruitTurn===2) {
        fruitSize += fruitGrowthRate * deltaTime;
      }
      
      if (fruitSize < 8 && fruitTurn===3) {
        fruitSize += fruitGrowthRate * deltaTime;
      }      
    }

    function updateCanvas(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCircle();
      drawDot();
      drawFruit();
      drawText();
      if (
  (fruitTurn === 1 && Math.abs(fruitSize - 4) < 0.1) ||
  (fruitTurn === 2 && Math.abs(fruitSize - 7) < 0.1) ||
  (fruitTurn === 3 && Math.abs(fruitSize - 8) < 0.1)
) {
  if (checkCollision()) {
    fruitSize = 0; // Reset fruit size
    fruitTurn = (fruitTurn % 3) + 1; // Cycle through 1, 2, 3
    fruitAngle = (fruitTurn - 1) * (Math.PI * 2 / 3); // Calculate new position (0, 120, 240 degrees)
  }
}
      updateFruitSize(timestamp);
      requestAnimationFrame(updateCanvas);
    }

    canvas.addEventListener('mousedown', (event) => {
      if (event.button === 0) { // Check if left mouse button is pressed
        isDragging = true;
      }
    });

    canvas.addEventListener('mouseup', () => {
      isDragging = false;
    });

    canvas.addEventListener('mousemove', (event) => {
      if (isDragging) {
        const mouseX = event.clientX;
        const mouseY = event.clientY;

        // Calculate angle of mouse pointer relative to the center of the circle
        const dx = mouseX - centerX;
        const dy = mouseY - centerY;
        dotAngle = Math.atan2(dy, dx);
      }
    });

    canvas.addEventListener('touchstart', (event) => {
      isDragging = true;
      const touch = event.touches[0];
      const dx = touch.clientX - centerX;
      const dy = touch.clientY - centerY;
      dotAngle = Math.atan2(dy, dx);
    });

    canvas.addEventListener('touchmove', (event) => {
      if (isDragging) {
        const touch = event.touches[0];
        const dx = touch.clientX - centerX;
        const dy = touch.clientY - centerY;
        dotAngle = Math.atan2(dy, dx);
      }
    });

    canvas.addEventListener('touchend', () => {
      isDragging = false;
    });

    // Initial draw and start animation
    requestAnimationFrame(updateCanvas);

    function updateFruitSize(timestamp) {
    if (!lastTimestamp) {
        lastTimestamp = timestamp;
        return;
    }
    const deltaTime = (timestamp - lastTimestamp) / 1000; // Convert to seconds
    lastTimestamp = timestamp;

    // Adjust size with cap
    if (fruitTurn === 1 && fruitSize < 4) {
        fruitSize = Math.min(fruitSize + fruitGrowthRate * deltaTime, 4);
    } else if (fruitTurn === 2 && fruitSize < 7) {
        fruitSize = Math.min(fruitSize + fruitGrowthRate * deltaTime, 7);
    } else if (fruitTurn === 3 && fruitSize < 8) {
        fruitSize = Math.min(fruitSize + fruitGrowthRate * deltaTime, 8);
    }
}

    window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Update center based on new dimensions
    centerX = canvas.width / 2;
    centerY = canvas.height / 2;

    // Redraw everything
    drawCircle();
});

  </script>
</body>
</html>
