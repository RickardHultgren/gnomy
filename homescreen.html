            <div class="button" id="lantern-button"  style="background-image:url('lantern.png') ;">
                <p style="display:none;"><span id="lantern-light">75% light</span></p> 
            </div>
             <svg xmlns="http://www.w3.org/2000/svg" class="lamp-effect" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="lightGradient" x1="0.5" y1="0" x2="0.5" y2="1">
                        <stop offset="0%" stop-color="black" stop-opacity="1"/>
                        <stop offset="100%" stop-color="black" stop-opacity="0"/>
                    </linearGradient>
                    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>
                </defs>
                <!-- Left black triangle -->
                <polygon points="0,0 50,0 0,100" fill="url(#lightGradient)" filter="url(#blurFilter)"/>
                <!-- Right black triangle -->
                <polygon points="50,0 100,0 100,100" fill="url(#lightGradient)" filter="url(#blurFilter)"/>
            </svg>
