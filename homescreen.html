    <div id="frame">
        <div id="hud">
            <div class="hud-button" id="gnomy-container" style="background-image:url(GnomyLogo.png) ;">
                    
                    <div id="gnomy-dialogue" style="position:absolute;background-color:#eeeeee; color:#333333;">
                        <p id="gnomy-speech" style="display:none;">Hello! How can I help today?</p>
                    </div>
            </div>
    
                <!-- Lantern of Emotions -->
            <div class="hud-button" id="lantern-container"  style="background-image:url(lantern.png) ;">
                <p style="display:none;"><span id="lantern-light">75% light</span></p> 
            </div>
    
                <!-- Beads (emotion tracking tool) -->
            <div class="hud-button" id="beads-container"  style="background-image:url(bead.png);" onclick="location.href='bead.html';">
            </div>
    
                <!-- Easy Access Buttons -->
                <!-- Beads (emotion tracking tool) -->
            <div class="hud-button" id="calendar-container"  style="background-image:url(calendar.png) ;">
            </div>
    
            <div id="panic-button" onclick="location.href='panic.html';">
            !
            </div>
    
            <div class="hud-button">
            <!-- Game Menu -->
            <!--div id="game-menu">

            </div-->                
                    &#9776;
            </div>
    
        </div>

        <div id="tools">
            <div id="search-garden">
                    <input type="text" placeholder="Search for gardens..." />
                    <button id="garden-search-btn">Search</button>
                    <button id="garden-new-btn">New Garden</button>                    
            </div>
            <div id="search-treas">
                    <input type="text" id="tree-search-bar" placeholder="Search for trees in the garden..." />
                    <button id="tree-search-btn">Search</button>
            </div><br>
                <button id="addNodeBtn" style:="font-family: 'Lora', serif;">Add Tree</button>
                <button id="addBranchBtn" style:="font-family: 'Lora', serif;">Add Path</button>
                <button id="deleteNodeBtn" style="font-family: 'Lora', serif;display: none;">Delete Tree</button>
        </div>
            
        <!-- Map Section -->

        <div id="map">ID map 
            <svg class="lamp-effect" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Black triangles on the sides -->
                <polygon points="0,0 50,0 0,100" fill="black" />
                <polygon points="100,0 50,0 100,100" fill="black" />
                <!-- Gradient towards the bottom -->
                <rect x="0" y="0" width="100" height="100" fill="url(#light-gradient)" />
                <defs>
                    <linearGradient id="light-gradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="black" stop-opacity="0" />
                        <stop offset="100%" stop-color="black" stop-opacity="1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
                       

    </div>

    <!-- JavaScript -->
    <script src="d3.min.js"></script>
    <script src="app.js"></script> <!-- Assuming a JS file for interactivity -->
