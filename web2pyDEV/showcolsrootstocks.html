<div id="left" style="display:inline-block; width:40vw;height:auto;background-color:white;vertical-align: text-top; thin; font-size:3vh;margin:0px; padding:0px; min-width: 10em; border-width:0px;">

    <style>
        div{
            font-size:3vh;     margin:0px;padding:0px;
        }
    </style>
    <div id="addrootstockbttn" style="border-width:2px;
    border: 4px solid #555555;
    
    color: #333333;
font-size:3vh; margin:0px;padding:0px;  border-radius: 20px;border-width:2px;
    border: 4px solid #555555;
    padding: 1em;
    color: #333333;

    background-color: #eeeeee;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);width:40vw;margin-left:5vw;display:inline-block;min-width: 10em; border-width:1px;display:none;">
<span style="font-style:italic;font-weight:bold;">
    New rootstock
</span>
{{try:}}
    {{#if auth.is_logged_in():}}
        {{=create_form}}
    {{#pass}}
{{except:}}
    {{pass}}

    </div>
<script>
function showadd() {
    var addrootstockbttn = document.getElementById('addrootstockbttn');

    if (addrootstockbttn.style.display === 'inline-block') {
        addrootstockbttn.style.display = 'none';
    } else {
        addrootstockbttn.style.display = 'inline-block';
    }
}
</script>
{{if auth.is_logged_in():}}
    {{=BUTTON("Add rootstock", _onclick="showadd();", _style="border-color:black;border-width:1px;")}}
{{pass}}
<hr>
Search rootstock
{{=rootstock_grid}}
</div>

<!-- JavaScript for handling AJAX interactions -->
<script>
$(document).ready(function() {
    // Intercept form submission for creating a rootstock
    $('#createrootstockFormContainer form').submit(function(event) {
        event.preventDefault(); // Prevent default form submission behavior

        // Serialize form data
        var formData = $(this).serialize();

        // Send form data via AJAX to create_rootstock endpoint
        $.ajax({
            url: "{{=URL('default', 'create_rootstock')}}",
            type: "POST",
            data: formData,
            success: function(response) {
                $('#showcolsrootstocks').html("rootstock created successfully!");
                // Optionally, reload specific parts of the page or update UI components
            },
            error: function(xhr, status, error) {
                $('#formSubmissionResult').html("Error: " + error);
            }
        });
    });
</script>
<script>
    // Function to handle rootstock deletion via AJAX
    function deleterootstock() {
        if (confirm("Are you sure you want to delete this rootstock {{=session.rootstock_id}}?")) {
            $.ajax({
                url: "{{=URL('default', 'rootstockdelete')}}",
                type: "POST",
                success: function(response) {
                    //alert(response); // Show success message
                    //reloadShownextView();
                    document.getElementById('rootstockpond').reload(true);
                },
                error: function(xhr, status, error) {
                    console.error("Error deleting rootstock:", error);
                    alert("Error deleting rootstock.");
                }
            });
        }
    }
</script>
<script>
    // Function to reload content in 'nextrootstock' based on search keyword
    function reloadrootstockpond() {
        var keyword = $('#searchInput').val();  // Ensure keyword is obtained from an input field
        
        $.ajax({
            url: "{{=URL('default', 'shownextrootstocks')}}",
            type: "GET",
            data: { colnodkeyword: keyword },  // Ensure this parameter exists in your controller
            success: function(response) {
                $('#nextrootstock').html(response);
            },
            error: function(xhr, status, error) {
                console.error("Error reloading 'nextrootstock': " + error);
            }
        });
    }
    // Function to reload 'left' content
    function reloadShownextView() {
        $.ajax({
            url: "{{=URL('default', 'showcolsrootstocks')}}",
            type: "GET",
            dataType: "json",
            success: function(response) {
                $('#rootstockpond').html(response.knotstock_grid);
            },
            error: function(xhr, status, error) {
                console.error("Error reloading content:", error);
            }
        });
    }
});
</script>
