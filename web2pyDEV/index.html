<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knotstocks & Tendrils</title>
    <script>
        // Fetch all rootstocks for the dropdown
        function fetchRootstocksForSelect() {
            fetch("{{=URL('get_rootstocks')}}")
                .then(response => response.json())
                .then(data => {
                    let select = document.getElementById("rootstock-select");
                    select.innerHTML = "";

                    data.rootstocks.forEach(rootstock => {
                        select.innerHTML += `<option value="${rootstock.id}">${rootstock.name}</option>`;
                    });

                    // Automatically fetch tendrils for the first rootstock
                    if (data.rootstocks.length > 0) {
                        fetchTendrils(data.rootstocks[0].id);
                    }
                });
        }

        // Fetch tendrils for a selected rootstock
        function fetchTendrils(rootstockId) {
            fetch(`{{=URL('get_tendrils')}}?rootstock_id=${rootstockId}`)
                .then(response => response.json())
                .then(data => {
                    let tendrilTable = document.getElementById("tendril-table-body");
                    tendrilTable.innerHTML = "";

                    data.tendrils.forEach(tendril => {
                        tendrilTable.innerHTML += `
                            <tr>
                                <td>${tendril.name}</td>
                                <td>${tendril.knotstock}</td>
                            </tr>`;
                    });

                    document.getElementById("selected-rootstock").textContent = `Tendrils connected to ${rootstockId}`;
                });
        }

        // Handle adding a new tendril
        function addTendril(event) {
            event.preventDefault();

            let tendrilName = document.getElementById("tendril-name").value;
            let selectedRootstockId = document.getElementById("rootstock-select").value;

            if (!tendrilName) return alert("Enter a tendril name.");

            fetch("{{=URL('add_tendril')}}", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `rootstock_id=${selectedRootstockId}&name=${encodeURIComponent(tendrilName)}`
            }).then(() => {
                fetchTendrils(selectedRootstockId);
                document.getElementById("tendril-name").value = "";
            });
        }

        // Initialize rootstocks on page load
        window.onload = function() {
            fetchRootstocksForSelect();
        };
    </script>
</head>
<body>
    <h2>Knotstocks & Tendrils</h2>

    <!-- Add Tendril Form -->
    <h3>Add Tendril</h3>
    <form id="add-tendril-form" onsubmit="addTendril(event)">
        <label for="tendril-name">Tendril Name:</label>
        <input type="text" id="tendril-name" placeholder="Enter Tendril Name">

        <label for="rootstock-select">Select Rootstock:</label>
        <select id="rootstock-select" onchange="fetchTendrils(this.value)">
            <!-- Populated dynamically -->
        </select>

        <button type="submit">Add Tendril</button>
    </form>

    <h3 id="selected-rootstock">Tendrils connected to [rootstock_id]</h3>

    <!-- Tendril Grid -->
    <table border="1">
        <thead>
            <tr>
                <th>Tendril Name</th>
                <th>Knotstock</th>
            </tr>
        </thead>
        <tbody id="tendril-table-body">
            <!-- Populated dynamically -->
        </tbody>
    </table>
</body>
</html>
