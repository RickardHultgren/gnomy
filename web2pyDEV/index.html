{{extend 'layout.html'}}

{{if not auth.is_logged_in():}}
    <h2>{{=message}}</h2>
{{else:}}
    <h2>Ponds</h2>
    <div>
        {{=pond_form}}
    </div>

    <table border="1">
        <tr>
            <th>Pond Name</th>
            <th>Actions</th>
        </tr>
        {{for pond in ponds:}}
        <tr>
            <td>
                <a href="#" onclick="showPond({{=pond.id}})">{{=pond.name}}</a>
            </td>
            <td>
                <button onclick="showPond({{=pond.id}})">View Rootstocks</button>
            </td>
        </tr>
        {{pass}}
    </table>

    <div id="pond-container" style="display:none; border:1px solid #000; padding:10px; margin-top:10px;">
        <h3>Rootstocks for Pond</h3>
        <div id="rootstock-grid">
            <!-- Rootstock grid will be populated dynamically -->
        </div>
    </div>
    
<!-- Knotstock List with Add Form -->
<div id="knotstock-list">
  <h3>Knotstocks for Selected Rootstock</h3>
  <ul id="knotstock-items"></ul>

    <form id="add-knotstock-form" onsubmit="addKnotstock(event)">
        <label for="new-rootstock">Select Rootstock:</label>
        <select id="new-rootstock" name="rootstock_id">
            <!-- Options will be populated dynamically -->
        </select>

        <label for="new-knotstock">Select Knotstock:</label>
        <select id="new-knotstock" name="knotstock_id">
            <!-- Options will be populated dynamically -->
        </select>

        <button type="submit">Add Knotstock</button>
    </form>
</div>  
  
<!-- Rootstock Form -->
<form id="add-rootstock-form" onsubmit="addRootstock(event)">
    <label for="pond-select">Select Pond:</label>
    <select id="pond-select" name="pond_id" onchange="fetchRootstocks(this.value)">
        <!-- Pond options will be loaded dynamically -->
    </select>

    <label for="rootstock-name">Rootstock Name:</label>
    <input type="text" id="rootstock-name" name="rootstock_name" required>

    <button type="submit">Add Rootstock</button>
</form>

<!-- Flower Selection Form -->
<form id="add-flower-form" onsubmit="addFlower(event)">
    <label for="flower-name">Flower Name:</label>
    <input type="text" id="flower-name" name="flower_name" required>

    <label for="flower-type">Flower Type:</label>
    <select id="flower-type" name="flower_type">
        <option value="Relatiris">Relatiris</option>
        <option value="Competentia">Competentia</option>
    </select>

    <label for="growing-place">Growing Place:</label>
    <select id="growing-place" name="growing_place">
        <option value="rootstock">Rootstock</option>
        <option value="tendril">Tendril</option>
    </select>

    <label for="flower-rootstock">Select Rootstock:</label>
    <select id="flower-rootstock" name="rootstock_id">
        <!-- Rootstock options will be loaded dynamically -->
    </select>

    <button type="submit">Add Flower</button>
</form>
  
<script>
document.addEventListener("DOMContentLoaded", function() {
    let selectedPondId = "{{=request.vars.pond_id or ''}}";
    let selectedRootstockId = "{{=request.vars.rootstock_id or ''}}";

    fetchPonds(selectedPondId);
    if (selectedPondId) {
        fetchRootstocks(selectedPondId, selectedRootstockId);
    }
});

function fetchPonds(selectedPondId = null) {
    fetch("{{=URL('get_ponds')}}")
        .then(response => response.json())
        .then(data => {
            let pondSelect = document.getElementById("pond-select");
            pondSelect.innerHTML = "";

            data.ponds.forEach(pond => {
                let option = document.createElement("option");
                option.value = pond.id;
                option.textContent = pond.name;
                if (selectedPondId && pond.id == selectedPondId) {
                    option.selected = true;
                }
                pondSelect.appendChild(option);
            });

            if (selectedPondId) {
                fetchRootstocks(selectedPondId);
            }
        })
        .catch(error => console.error("Error fetching ponds:", error));
}

function fetchRootstocks(pondId, selectedRootstockId = null) {
    fetch("{{=URL('get_rootstocks')}}" + "?pond_id=" + pondId)
        .then(response => response.json())
        .then(data => {
            let rootstockSelect = document.getElementById("flower-rootstock");
            rootstockSelect.innerHTML = "";

            let newRootstockSelect = document.getElementById("new-rootstock");
            newRootstockSelect.innerHTML = "";

            data.rootstocks.forEach(rootstock => {
                let option = document.createElement("option");
                option.value = rootstock.id;
                option.textContent = rootstock.name;
                if (selectedRootstockId && rootstock.id == selectedRootstockId) {
                    option.selected = true;
                }
                rootstockSelect.appendChild(option);
                newRootstockSelect.appendChild(option.cloneNode(true));
            });
        })
        .catch(error => console.error("Error fetching rootstocks:", error));
}

function addRootstock(event) {
    event.preventDefault();
    let pondId = document.getElementById("pond-select").value;
    let rootstockName = document.getElementById("rootstock-name").value;

    if (!pondId || !rootstockName) {
        alert("Please fill all fields.");
        return;
    }

    fetch("{{=URL('add_rootstock')}}", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `pond_id=${pondId}&rootstock_name=${rootstockName}`
    })
    .then(response => response.text())
    .then(message => {
        alert(message);
        fetchRootstocks(pondId);
    })
    .catch(error => console.error("Error adding rootstock:", error));
}

function addFlower(event) {
    event.preventDefault();

    let flowerName = document.getElementById("flower-name").value;
    let flowerType = document.getElementById("flower-type").value;
    let growingPlace = document.getElementById("growing-place").value;
    let rootstockId = document.getElementById("flower-rootstock").value;

    if (!flowerName || !flowerType || !growingPlace || !rootstockId) {
        alert("Please fill all fields.");
        return;
    }

    fetch("{{=URL('add_flower')}}", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `flower_name=${flowerName}&flower_type=${flowerType}&growing_place=${growingPlace}&rootstock_id=${rootstockId}`
    })
    .then(response => response.text())
    .then(message => {
        alert(message);
    })
    .catch(error => console.error("Error adding flower:", error));
}
</script>
