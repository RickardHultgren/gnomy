{{extend 'layout.html'}}

{{if message:}}
    <div>{{=message}}</div>
{{pass}}

{{if form:}}
    <h2>Add a New Pond</h2>
    {{=form}}
{{pass}}

<h2>Ponds</h2>
{{=grid}}

<div id="pond-container"></div>

<script>
function loadPond(pond_id) {
    // Load the pond details into the pond-container div using AJAX
    $.ajax({
        url: '{{=URL('default', 'pond')}}/' + pond_id,
        success: function(response) {
            $('#pond-container').html(response);
        },
        error: function() {
            alert('Failed to load pond details.');
        }
    });
}
</script>
