{{extend 'layout.html'}}

{{if message:}}
    <div>{{=message}}</div>
{{else:}}
    <!-- Pond Section -->
    {{if form:}}
        <h2>Add a New Pond</h2>
        <div id="pond-form-container">
            {{=form}}
        </div>
    {{pass}}

    <h2>Ponds</h2>
    <div id="pond-grid">
        {{=grid}}
    </div>

    <!-- Rootstock Section -->
    <h2>Rootstocks</h2>
    <div id="rootstock-form-container"></div>  
    <div id="rootstock-grid-container"></div>

    <script>
            document.addEventListener("DOMContentLoaded", function() {
                document.querySelectorAll(".pond-link").forEach(function(link) {
                    link.addEventListener("click", function(e) {
                        e.preventDefault();
                        let pond_id = this.getAttribute("data-pond-id");

                        if (!pond_id || pond_id === "null") {
                            console.error("Invalid pond_id received:", pond_id);
                            return;
                        }

                        // Load rootstock form dynamically
                        fetch("{{=URL('get_rootstock_form')}}?pond_id=" + pond_id)
                            .then(response => response.text())
                            .then(data => document.getElementById("rootstock-form-container").innerHTML = data);

                        // Load rootstock grid dynamically
                        fetch("{{=URL('get_rootstocks')}}?pond_id=" + pond_id)
                            .then(response => response.text())
                            .then(data => document.getElementById("rootstock-grid-container").innerHTML = data);
                    });
                });
            });
            // Handle rootstock form submission via Fetch API
            document.addEventListener("submit", function(e) {
                if (e.target && e.target.id === "pond-form") {
                    e.preventDefault();
                    let form = e.target;
                    let formData = new FormData(form);

                    fetch("{{=URL('index')}}", { method: "POST", body: formData })
                        .then(response => response.text())
                        .then(data => {
                            document.getElementById("pond-grid").innerHTML = data; // Refresh pond grid
                            attachPondClickListeners(); // Reattach event listeners
                        });
                }
            });

            function attachPondClickListeners() {
              setTimeout(function() {  // Delay to allow DOM updates
                  document.querySelectorAll(".pond-link").forEach(function(link) {
                      link.addEventListener("click", function(e) {
                          e.preventDefault();
                          let pond_id = this.getAttribute("data-pond-id");

                          console.log("Clicked Pond:", this, "Pond ID:", pond_id);  // Debug

                          if (!pond_id || pond_id === "null" || pond_id === "0") {
                              console.error("Invalid pond_id received:", pond_id);
                              return;
                          }

                          // Load rootstock form dynamically
                          fetch("{{=URL('get_rootstock_form')}}?pond_id=" + pond_id)
                              .then(response => response.text())
                              .then(data => document.getElementById("rootstock-form-container").innerHTML = data);

                          // Load rootstock grid dynamically
                          fetch("{{=URL('get_rootstocks')}}?pond_id=" + pond_id)
                              .then(response => response.text())
                              .then(data => document.getElementById("rootstock-grid-container").innerHTML = data);
                      });
                  });
              }, 500); // Delay to ensure DOM updates
          }

          // Call function on page load
          document.addEventListener("DOMContentLoaded", attachPondClickListeners);

          // Call function on page load
          document.addEventListener("DOMContentLoaded", attachPondClickListeners);




  </script>
{{pass}}
