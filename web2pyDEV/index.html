{{extend 'layout.html'}}

{{if message:}}
    <div>{{=message}}</div>
{{pass}}

{{if form:}}
    <h2>Add a New Pond</h2>
    {{=form}}
{{pass}}

<script>
function loadPond(pond_id) {
    fetch("{{=URL('pond')}}" + "/" + pond_id)
        .then(response => response.text())
        .then(html => {
            document.getElementById("pond-container").innerHTML = html;
        });
}
</script>

<div id="pond-container"></div>

<h2>Ponds</h2>
{{=grid}}
