{{extend 'layout.html'}}

{{if message:}}
    <div>{{=message}}</div>
{{else:}}
    {{if form:}}
        <h2>Add a New Pond</h2>
        {{=form}}
    {{pass}}

    <h2>Ponds</h2>
    {{=grid}}

    <div id="pond-container"></div>

    <script>
        function loadPond(pond_id) {
            $("#pond-container").load("{{=URL('pond', args=[''])}}/" + pond_id);
        }
    </script>
{{pass}}
