{{extend 'layout.html'}}

{{if message:}}
    <div>{{=message}}</div>
{{else:}}
    {{if form:}}
        <h2>Add a New Pond</h2>
        {{=form}}
    {{pass}}

    <h2>Ponds</h2>
    {{=grid}}

    <div id="pond-container"></div>  <!-- Pond details load here -->
    <div id="rootstock-container"></div>  <!-- Rootstock details load here -->


    <script>
      $(document).ready(function() {
          // Use event delegation to handle clicks
          $(document).on('click', '.pond-link', function(e) {
              e.preventDefault();
              var pond_id = $(this).data('pond-id');
              loadPond(pond_id);
          });
      });
  
      function loadPond(pond_id) {
          $("#pond-container").load("{{=URL('default', 'pond')}}/" + pond_id);
      }
    s</script>

  
{{pass}}
