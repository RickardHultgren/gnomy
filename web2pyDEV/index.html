{{extend 'layout.html'}}

{{if message:}}
    <div>{{=message}}</div>
{{else:}}
    <!-- Pond Section -->
    {{if form:}}
        <h2>Add a New Pond</h2>
        {{=form}}
    {{pass}}

    <h2>Ponds</h2>
    {{=grid}}

    <!-- Rootstock Section -->
    {{if rootstock_form:}}
        <h2>Add a New Rootstock (For Selected Pond)</h2>
        {{=rootstock_form}}
    {{pass}}

    <h2>Rootstocks</h2>
    {{=rootstock_grid}}

    <script>
        $(document).ready(function() {
            // Handle pond selection dynamically
            $(document).on('click', '.pond-link', function(e) {
                e.preventDefault();
                var pond_url = this.href;
                window.location.href = pond_url; // Reload page with the selected pond
            });
        });
    </script>
{{pass}}
