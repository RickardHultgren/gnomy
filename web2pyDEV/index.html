{{extend 'layout.html'}}

{{if not auth.is_logged_in():}}
    <h2>{{=message}}</h2>
{{else:}}
    <h2>Ponds</h2>
    <div>
        {{=pond_form}}
    </div>

    <table border="1">
        <tr>
            <th>Pond Name</th>
            <th>Actions</th>
        </tr>
        {{for pond in ponds:}}
        <tr>
            <td>
                <a href="#" onclick="showPond({{=pond.id}})">{{=pond.name}}</a>
            </td>
            <td>
                <button onclick="showPond({{=pond.id}})">View Rootstocks</button>
            </td>
        </tr>
        {{pass}}
    </table>

    <div id="pond-container" style="display:none; border:1px solid #000; padding:10px; margin-top:10px;">
        <h3>Rootstocks for Pond</h3>
        <div id="rootstock-grid"></div>

        <h3>Add Rootstock</h3>
        <input type="text" id="rootstock-name" placeholder="Rootstock name">
        <button onclick="addRootstock()">Add</button>
    </div>
    <div id="rootstock-details" style="display:none;">
        
        <div id="selected-rootstock-id"></div>
        <div id="map"></div>
        
        <!-- Flower Section (Initially Hidden) -->
        <div id="flower-container" style="display:none; border:1px solid #000; padding:10px; margin-top:10px;">
            <h3>Flowers for Selected Rootstock</h3>
            <table id="flower-grid" border="1">
                <tr>
                    <th>Flower Name</th>
                </tr>
            </table>

            <h3>Add Flower</h3>
            <form id="add-flower-form" onsubmit="addFlower(event)">
                <input type="text" id="flower-name" placeholder="Flower Name">
                <button type="submit">Add Flower</button>
            </form>
        </div>
    </div>
    <script>
        var currentPondId = null;
        var selectedRootstockId = null;

        
</script>
<script>
    function showPond(pondId) {
        currentPondId = pondId;
        document.getElementById("pond-container").style.display = "block";
        fetchRootstocks(pondId);
    }
</script>

<script>













let selectedRootstockId = null;

function selectedRootstockId(action, params = {}) {
    if (action === "select") {
        fetch("{{=URL('set_rootstock_id')}}", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `rootstock_id=${params.rootstockId}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                selectedRootstockId = data.rootstock_id; // Store in local variable
                document.getElementById("selected-rootstock-id").innerText = 
                    `ID: ${data.rootstock_id}, Name: ${data.rootstock_name}`;
                document.getElementById("rootstock-details").style.display = "block";
            } else {
                console.error("Failed to set rootstock:", data.error);
            }
        })
        .catch(error => console.error("Error selecting rootstock:", error));

    } else if (action === "addTendril") {
        if (!selectedRootstockId) {
            console.error("No rootstock selected!");
            return;
        }

        fetch("{{=URL('add_tendril')}}", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `rootstock_id=${selectedRootstockId}&knotstock_id=${params.knotstockId}&tendril_name=${params.tendrilName}&tendril_carry=${params.tendrilCarry}&tendril_suffuse=${params.tendrilSuffuse}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                console.log("Tendril added successfully:", data.tendril_id);
                alert("Tendril added!");
            } else {
                console.error("Failed to add tendril:", data.error);
            }
        })
        .catch(error => console.error("Error adding tendril:", error));

    } else if (action === "fetchKnotstocks") {
        if (!params.pondId) {
            console.error("Pond ID is missing.");
            return;
        }

        fetch("{{=URL('get_rootstocks')}}" + "?pond_id=" + params.pondId)
            .then(response => response.json())
            .then(data => {
                let select = document.getElementById("knotstock-select");
                select.innerHTML = '<option value="">Select a Knotstock</option>'; // Reset options

                if (data.rootstocks && data.rootstocks.length > 0) {
                    data.rootstocks.forEach(rootstock => {
                        let option = document.createElement("option");
                        option.value = rootstock.id;
                        option.textContent = `${rootstock.id} ${rootstock.name}`;
                        select.appendChild(option);
                    });
                } else {
                    console.warn("No rootstocks found for this pond.");
                }
            })
            .catch(error => console.error("Error fetching rootstocks:", error));
    }
}












function selectRootstock(rootstockId, rootstockName) {
    fetch("{{=URL('set_rootstock_id')}}", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `rootstock_id=${rootstockId}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            document.getElementById("selected-rootstock-id").innerText = `ID: ${data.rootstock_id}, Name: ${data.rootstock_name}`;
            document.getElementById("rootstock-details").style.display = "block";

            // Store rootstock ID in localStorage in case the session is not persistent
            localStorage.setItem("rootstock_id", data.rootstock_id);
            
            // Fetch and display tendrils for the selected rootstock
            fetchTendrils(data.rootstock_id);
        } else {
            console.error("Failed to set rootstock:", data.error);
        }
    })
    .catch(error => console.error("Error selecting rootstock:", error));
}

// Function to fetch and display tendrils
function fetchTendrils(rootstockId) {
    fetch("{{=URL('get_tendrils')}}" + "?rootstock_id=" + rootstockId)
        .then(response => response.json())
        .then(data => {
            let tendrilGrid = document.getElementById("tendril-grid");
            tendrilGrid.innerHTML = "";  // Clear previous tendrils

            if (data.status === "success" && data.tendrils.length > 0) {
                data.tendrils.forEach(tendril => {
                    let tendrilItem = document.createElement("div");
                    tendrilItem.classList.add("tendril-item");
                    tendrilItem.innerHTML = `
                        <strong>${tendril.name}</strong><br>
                        Carry: ${tendril.carry || "N/A"}<br>
                        Suffuse: ${tendril.suffuse || "N/A"}
                    `;
                    tendrilGrid.appendChild(tendrilItem);
                });
            } else {
                tendrilGrid.innerHTML = "<p>No tendrils found for this rootstock.</p>";
            }
        })
        .catch(error => console.error("Error fetching tendrils:", error));
}

</script>
<script>

        function fetchTendrils() {
            let rootstockId = "{{=session.rootstock_id}}";

            if (!rootstockId || isNaN(rootstockId)) {
                console.error("Invalid rootstock ID:", rootstockId);
                return;
            }

            fetch("{{=URL('get_tendrils')}}" + "?rootstock_id=" + encodeURIComponent(rootstockId))
                .then(response => response.json())
                .then(data => {
                    let grid = document.getElementById("tendril-grid");
                    grid.innerHTML = "";

                    if (data.error) {
                        console.error("Error fetching tendrils:", data.error);
                        grid.innerHTML = `<p style="color:red;">${data.error}</p>`;
                        return;
                    }

                    if (data.tendrils.length > 0) {
                        data.tendrils.forEach(tendril => {
                            grid.innerHTML += `<p>
                                <a href="#" onclick="selectTendril(${tendril.id}, '${tendril.name}'); return false;">
                                    ${tendril.name}
                                </a>
                            </p>`;
                        });
                    } else {
                        grid.innerHTML = "<p>No tendrils found.</p>";
                    }
                })
                .catch(error => console.error("Error fetching tendrils:", error));
        }
</script>
<script>
        function selectTendril(tendrilId, tendrilName) {
            console.log("Selected tendril:", tendrilId, tendrilName);

            let tendrilNameElem = document.getElementById("selected-tendril-name");
            let tendrilContainer = document.getElementById("tendril-container");

            if (tendrilNameElem && tendrilContainer) {
                tendrilNameElem.textContent = tendrilName;
                tendrilContainer.style.display = "block";
            } else {
                console.error("UI elements for tendril selection not found");
            }

            // Store the selected tendril ID for further actions if needed
            window.selectedTendrilId = tendrilId;
        }
        
    
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("add-tendril-form").onsubmit = addTendril;
    });
    </script>
<script>
        function fetchFlowers(rootstockId) {
            selectedRootstockId = rootstockId;
            document.getElementById("flower-container").style.display = "block";

            fetch("{{=URL('get_flowers')}}" + "?rootstock_id=" + rootstockId)
                .then(response => response.json())
                .then(data => {
                    let table = document.getElementById("flower-grid");
                    table.innerHTML = "<tr><th>Flower Name</th></tr>";

                    data.flowers.forEach(flower => {
                        table.innerHTML += `<tr><td>${flower.name}</td></tr>`;
                    });
                });
        }

</script>
<script>

        function addFlower(event) {
            event.preventDefault();

            let name = document.getElementById("flower-name").value;
            if (!name) return alert("Enter flower name.");

            fetch("{{=URL('add_flower')}}", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `rootstock_id=${selectedRootstockId}&name=${encodeURIComponent(name)}`
            }).then(() => {
                fetchFlowers(selectedRootstockId);
                document.getElementById("flower-name").value = "";
            });
        }
</script>
