{{extend 'layout.html'}}

{{if not auth.is_logged_in():}}
    <h2>{{=message}}</h2>
{{else:}}
    <h2>Ponds</h2>
    <div>
        {{=pond_form}}
    </div>

    <table border="1">
        <tr>
            <th>Pond Name</th>
            <th>Actions</th>
        </tr>
        {{for pond in ponds:}}
        <tr>
            <td>
                <a href="#" onclick="showPond({{=pond.id}})">{{=pond.name}}</a>
            </td>
            <td>
                <button onclick="showPond({{=pond.id}})">View Rootstocks</button>
            </td>
        </tr>
        {{pass}}
    </table>

    <div id="pond-container" style="display:none; border:1px solid #000; padding:10px; margin-top:10px;">
        <h3>Rootstocks for Pond</h3>
        <div id="rootstock-grid">
            <!-- Rootstock grid will be populated dynamically -->
        </div>

        <h3>Add Rootstock</h3>
        <input type="text" id="rootstock-name" placeholder="Rootstock name">
        <button onclick="addRootstock()">Add</button>
    </div>

    <script>
        var currentPondId = null;

        function showPond(pondId) {
            currentPondId = pondId;
            document.getElementById("pond-container").style.display = "block";
            fetchRootstocks(pondId);
        }
        function fetchRootstocks(pondId) {
          fetch("{{=URL('get_rootstocks')}}" + "?pond_id=" + pondId)
              .then(response => response.json())
              .then(data => {
                  console.log(data); // Debugging: check returned data structure

                  let grid = document.getElementById("rootstock-grid");
                  if (data.rootstocks && data.rootstocks.length > 0) {
                      // Start the table HTML
                      let tableHtml = "<table border='1'><tr><th>Rootstock Name</th></tr>";

                      // Loop through each rootstock and create clickable links
                      data.rootstocks.forEach(rootstock => {
                          tableHtml += `<tr>
                              <td><a href="#" onclick="fetchKnotstocks(${rootstock.id}); return false;">${rootstock.name}</a></td>
                          </tr>`;
                      });

                      // Close the table
                      tableHtml += "</table>";

                      // Update the grid with the table HTML
                      grid.innerHTML = tableHtml;
                  } else {
                      grid.innerHTML = "No rootstocks found for this pond.";
                  }
              })
              .catch(error => {
                  console.error("Error fetching rootstocks:", error);
              });
      }

      function fetchKnotstocks(rootstockId) {
          fetch("{{=URL('get_knotstocks')}}" + "?rootstock_id=" + rootstockId)
              .then(response => response.json())
              .then(data => {
                  let list = document.getElementById("knotstock-list");
                  list.innerHTML = "<h3>Knotstocks for selected Rootstock</h3>";

                  if (data.knotstocks && data.knotstocks.length > 0) {
                      list.innerHTML += "<ul>";
                      data.knotstocks.forEach(knotstock => {
                          list.innerHTML += `<li>${knotstock.knotstock_name} (Added by: ${knotstock.created_by})</li>`;
                      });
                      list.innerHTML += "</ul>";
                  } else {
                      list.innerHTML += "<p>No knotstocks found for this rootstock.</p>";
                  }
              })
              .catch(error => console.error("Error fetching knotstocks:", error));
      }

        function addRootstock() {
            let name = document.getElementById("rootstock-name").value;
            if (!name) {
                alert("Please enter a rootstock name.");
                return;
            }

            fetch("{{=URL('add_rootstock')}}", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "pond_id=" + currentPondId + "&name=" + encodeURIComponent(name)
            })
            .then(response => response.text())
            .then(() => {
                fetchRootstocks(currentPondId);
                document.getElementById("rootstock-name").value = "";
            });
        }




        function addKnotstock(rootstockId, knotstockId) {
    fetch("{{=URL('add_knotstock')}}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
            rootstock_id: rootstockId,
            knotstock_id: knotstockId
        })
    })
    .then(response => response.json()) 
    .then(data => {
        if (data.success) {
            alert("Knotstock added successfully!");
            fetchKnotstocks(rootstockId); // Refresh the list
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(error => console.error("Error:", error));
}


    </script>
{{pass}}
