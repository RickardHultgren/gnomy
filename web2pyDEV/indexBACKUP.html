<style>
.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    padding: 10px;
}

.tendril-card {
    background: #f8f9fa;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
}

.tendril-card h3 {
    margin: 5px 0;
}

.tendril-card p {
    font-size: 14px;
    color: #555;
}

.tendril-card button {
    margin-top: 5px;
    padding: 5px 10px;
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
    border-radius: 3px;
}

.tendril-card button:hover {
    background: #0056b3;
}

            <script>
function fetchKnotstocks(pondId) {
    if (!pondId) {
        console.error("Pond ID is missing.");
        return;
    }

    fetch("{{=URL('get_rootstocks')}}" + "?pond_id=" + pondId)
        .then(response => response.json())
        .then(data => {
            let select = document.getElementById("knotstock-select");
            select.innerHTML = '<option value="">Select a Knotstock</option>'; // Reset options

            if (data.rootstocks && data.rootstocks.length > 0) {
                data.rootstocks.forEach(rootstock => {
                    let option = document.createElement("option");
                    option.value = rootstock.id;
                    option.textContent = `${rootstock.id} ${rootstock.name}`;
                    select.appendChild(option);
                });
            } else {
                console.warn("No rootstocks found for this pond.");
            }
        })
        .catch(error => console.error("Error fetching rootstocks:", error));
}

                // Ensure we fetch knotstocks when a rootstock is selected

<script>

        function fetchRootstocks(pondId) {
            fetchKnotstocks(pondId);
            //document.getElementById("rootstock-details").style.display = "none";
            document.getElementById("rootstock-details").style.visibility = "hidden";
            fetch("{{=URL('get_rootstocks')}}" + "?pond_id=" + pondId)
                .then(response => response.json())
                .then(data => {
                    let grid = document.getElementById("rootstock-grid");
                    grid.innerHTML = "";

                    if (data.rootstocks.length > 0) {
                        data.rootstocks.forEach(rootstock => {
                            grid.innerHTML += `<p>
                                <a href="#" onclick="selectRootstock(${rootstock.id}, '${rootstock.name}'); return false;">
                                    ${rootstock.name}
                                </a>
                            </p>`;
                        });
                    } else {
                        grid.innerHTML = "<p>No rootstocks found.</p>";
                    }
                });
        }

</script>
<script>
function selectRootstock(rootstockId, rootstockName) { 
    rootstockidJS = rootstockId;
    fetch("{{=URL('set_rootstock_id')}}", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `rootstock_id=${rootstockId}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            document.getElementById("selected-rootstock-id").innerText = `ID: ${data.rootstock_id}, Name: ${data.rootstock_name}`;
            //document.getElementById("rootstock-details").style.display = "block";
            document.getElementById("rootstock-details").style.visibility = "visible";
            // Store rootstock ID in localStorage in case the session is not persistent
            localStorage.setItem("rootstock_id", data.rootstock_id);
            fetchTendrils(data.rootstock_id);
            fetchFlowers(data.rootstock_id);
        } else {
            console.error("Failed to set rootstock:", data.error);
        }
    })
    .catch(error => console.error("Error selecting rootstock:", error));
}

</script>
<script>
    

function fetchFlowers(rootstockId) {
    // Retrieve rootstockId from localStorage or session variable
    //let rootstockId = localStorage.getItem("rootstock_id") || "{{=session.rootstock_id}}";

    if (!rootstockId || rootstockId === "None" || isNaN(rootstockId)) {
        console.error("Invalid rootstock ID:", rootstockId);
        return;
    }

    fetch("{{=URL('get_flowers')}}" + "?rootstock_id=" + encodeURIComponent(rootstockId))
        .then(response => response.json())
        .then(data => {
            let grid = document.getElementById("flower-grid");
            grid.innerHTML = ""; // Clear previous content

            if (data.status === "error") {
                console.error("Error fetching flowers:", data.error);
                grid.innerHTML = `<p style="color:red;">${data.error}</p>`;
                return;
            }

            if (data.flowers.length > 0) {
                let gridContainer = document.createElement("div");
                gridContainer.classList.add("grid-container");

                data.flowers.forEach(flower => {
                    let flowerCard = document.createElement("div");
                    flowerCard.classList.add("flower-card");

                    flowerCard.innerHTML = `
                        <h3>${flower.name}</h3>
                        <p><strong>Fruit:</strong> ${flower.fruit ? flower.fruit : "N/A"}</p>
                        <p><strong>Fragrance:</strong> ${flower.fragrance ? flower.fragrance : "N/A"}</p>
                        <button onclick="selectflower(${flower.id}, '${flower.name}')">
                            Select
                        </button>
                    `;

                    gridContainer.appendChild(flowerCard);
                });

                grid.appendChild(gridContainer);
            } else {
                grid.innerHTML = "<p>No flowers found.</p>";
            }
        })
        .catch(error => console.error("Error fetching flowers:", error));
}


function fetchTendrils(rootstockId) {
    // Retrieve rootstockId from localStorage or session variable
    //let rootstockId = localStorage.getItem("rootstock_id") || "{{=session.rootstock_id}}";

    if (!rootstockId || rootstockId === "None" || isNaN(rootstockId)) {
        console.error("Invalid rootstock ID:", rootstockId);
        return;
    }

    fetch("{{=URL('get_tendrils')}}" + "?rootstock_id=" + encodeURIComponent(rootstockId))
        .then(response => response.json())
        .then(data => {
            let grid = document.getElementById("tendril-grid");
            grid.innerHTML = ""; // Clear previous content

            if (data.status === "error") {
                console.error("Error fetching tendrils:", data.error);
                grid.innerHTML = `<p style="color:red;">${data.error}</p>`;
                return;
            }

            if (data.tendrils.length > 0) {
                let gridContainer = document.createElement("div");
                gridContainer.classList.add("grid-container");

                data.tendrils.forEach(tendril => {
                    let tendrilCard = document.createElement("div");
                    tendrilCard.classList.add("tendril-card");

                    tendrilCard.innerHTML = `
                        <h3>${tendril.name}</h3>
                        <p><strong>Carry:</strong> ${tendril.carry ? tendril.carry : "N/A"}</p>
                        <p><strong>Suffuse:</strong> ${tendril.suffuse ? tendril.suffuse : "N/A"}</p>
                        <button onclick="selectTendril(${tendril.id}, '${tendril.name}')">
                            Select
                        </button>
                    `;

                    gridContainer.appendChild(tendrilCard);
                });

                grid.appendChild(gridContainer);
            } else {
                grid.innerHTML = "<p>No tendrils found.</p>";
            }
        })
        .catch(error => console.error("Error fetching tendrils:", error));
}

</script>
<script>

            }

            // Store the selected flower ID for further actions if needed
            window.selectedflowerId = flowerId;

        }

</script>

<script>        
function addFlower(event) { 
    event.preventDefault();

    //let rootstockId = "{{=session.rootstock_id if session.rootstock_id else ''}}";
    
    //if (!rootstockId || rootstockId === "None") {
    //    console.error("Invalid rootstock ID:", rootstockId);
    //    return;
    //}

    let flowerName = document.getElementById("flower-name").value;
    let flowerFruit = document.getElementById("flower-fruit").value;
    let flowerFragrance = document.getElementById("flower-fragrance").value;

    fetch("{{=URL('add_flower')}}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            //rootstock_id: rootstockidJS,
            flower_name: flowerName,
            flower_fruit: flowerFruit,
            flower_fragrance: flowerFragrance
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            console.log("Flower added successfully:", data);
            fetchFlowers(rootstockidJS);  // Refresh the tendril list
            document.getElementById("add-flower-form").reset();
        } else {
            console.error("Failed to add flower:", data.error);
        }
    })
    .catch(error => console.error("Error adding flower:", error));
}

</script>
<script>
    function addTendril(event) {
            event.preventDefault();

            //let rootstockId = "{{=session.rootstock_id if session.rootstock_id else ''}}"; // Ensure it's not None
            let knotstockId = document.getElementById("knotstock-select").value;
            let tendrilName = document.getElementById("tendril-name").value;
            let tendrilCarry = document.getElementById("tendril-carry").value;
            let tendrilSuffuse = document.getElementById("tendril-suffuse").value;

            /*if (!rootstockId) {
                console.error("Rootstock ID is missing. Cannot add tendril.");
                return;
            }*/

            fetch("{{=URL('add_tendril')}}", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    //rootstock_id: {{=session.rootstock_id if session.rootstock_id else ''}}"; // Ensure it's not None
                    //rootstock_id: rootstockidJS,
                    knotstock_id: knotstockId,
                    tendril_name: tendrilName,
                    tendril_carry: tendrilCarry,
                    tendril_suffuse: tendrilSuffuse
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    console.log("Tendril added successfully:", data);
                    fetchTendrils(rootstockidJS);  // Refresh the tendril list
                    document.getElementById("add-tendril-form").reset();
                } else {
                    console.error("Failed to add tendril:", data.error);
                }
            })
            .catch(error => console.error("Error adding tendril:", error));
        }
</script>
<script>

        function addRootstock() {
            let name = document.getElementById("rootstock-name").value;
            if (!name) return alert("Enter rootstock name.");

            fetch("{{=URL('add_rootstock')}}", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `pond_id=${currentPondId}&name=${encodeURIComponent(name)}`
            }).then(() => {
                fetchRootstocks(currentPondId);
                document.getElementById("rootstock-name").value = "";
            });
        }
</script>
